<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
:root {
  --bg-page: #f0f2f5; --bg-card: #ffffff; --bg-hover: #eef0f4; --bg-input: #f5f6f8;
  --border: #dde0e5; --border-light: #c8ccd3;
  --text-primary: #1a1d24; --text-secondary: #4a5568; --text-muted: #718096;
  --accent: #3b82f6; --accent-hover: #2563eb; --accent-light: rgba(59,130,246,.15); --accent-bg: rgba(59,130,246,.08);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04); --shadow-md: 0 2px 8px rgba(0,0,0,.06); --shadow-lg: 0 4px 16px rgba(0,0,0,.08);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-page);color:var(--text-primary)}

.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:0 24px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:var(--shadow-sm)}
.header-brand{display:flex;align-items:center;gap:0;font-size:15px;font-weight:600;color:var(--text-primary);line-height:1}
.header-brand svg{width:28px;height:28px;color:var(--accent);display:block;flex-shrink:0;transform:translateY(-1px)}
.header-badge{font-size:11px;padding:4px 10px;background:var(--accent-bg);color:var(--accent);border-radius:20px;font-weight:500}
.btn{padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;user-select:none}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-light)}
.btn svg{width:13px;height:13px}
.btn-primary{background:var(--accent);color:#fff;border:1px solid #c8ced6;box-shadow:0 1px 3px rgba(59,130,246,.25)}
.btn-primary:hover{background:#5294fa}
.btn-primary:active{background:#1d4ed8}
.btn-secondary{padding:7px 14px 9px;background:var(--bg-input);border:1px solid var(--border);color:var(--text-secondary)}
.btn-secondary:hover{background:var(--bg-hover);border-color:var(--border-light);color:var(--text-primary)}
.btn-secondary:active{background:var(--border)}
.btn-danger{background:var(--bg-input);border:1px solid var(--border);color:#dc2626}
.btn-danger:hover{background:#fef2f2;border-color:#fecaca}
.btn-group{display:flex;gap:6px;align-items:center}
.btn-group .sep{width:1px;height:14px;background:var(--border);flex-shrink:0}

.toast-container{position:fixed;bottom:16px;left:16px;z-index:9999;display:flex;flex-direction:column-reverse;gap:10px;pointer-events:none}
/* Unified toast: white background on the main content area, the only
   type-specific color is the 3px decorative bar on the left (and the
   text color, which mirrors the bar's color family for legibility).
   Font is 12px (≈ 10% smaller than the previous 13px). */
.toast{padding:13px 20px;border-radius:var(--radius-sm);font-size:15px;box-shadow:var(--shadow-md);background:#ffffff;color:#1f2937;border:1px solid #e5e7eb;border-left:3px solid #6b7280;transform:translateX(120%);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:auto;max-width:500px;display:flex;align-items:center;gap:10px;line-height:1.5}
.toast.show{transform:translateX(0);opacity:1}
.toast.success{border-left-color:#10b981;color:#065f46}
.toast.error{border-left-color:#ef4444;color:#991b1b}
.toast.warning{border-left-color:#f59e0b;color:#92400e}
.toast.info{border-left-color:#3b82f6;color:#1e40af}
.toast-close{background:none;border:none;cursor:pointer;font-size:12px;opacity:.5;padding:2px 4px;border-radius:4px;color:inherit}
.toast-close:hover{opacity:1}


/*
 * ARCHITECTURE:
 *   .canvas          — viewport
 *     canvas#gridCvs   — grid lines drawn in screen-pixel space (no scaling artifacts)
 *     .canvas-world   — transform: translate(panX, panY) only (GPU-composited pan)
 *       svg#linesSvg   — NO transform of any kind (would cache as texture → blur)
 *         g.conn-group → g.lines / g.labels
 *           path.line — d attribute holds PRE-SCALED screen coords (re-rendered on zoom)
 *           text.line-label — x/y/font-size all pre-scaled (re-rendered on zoom)
 *       .canvas-nodes — transform: scale(scale) → re-render on zoom changes for crisp text
 *         .node       — transform: translate(nodeX, nodeY) in world coords
 */

.canvas{contain:layout style paint;position:relative;overflow:hidden;cursor:default;user-select:none;flex:1;min-height:0;background-color:#f8f9fb}
#gridCvs{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.canvas.grabbing{cursor:default}
.canvas-world{position:absolute;top:0;left:0;width:0;height:0;overflow:visible;will-change:transform;cursor:inherit}
/* transform: scale mode — re-render text at new size on big zoom changes.
   NOTE: nodesC.style.transform = scale() creates a compositor layer with
   a cached texture. _forceRerender (called from applyViewTransform) drops
   that cache on every zoom change so the browser re-rasterizes at the
   current scale. Without _forceRerender, text/borders would blur. */
.canvas-nodes{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:2;transform-origin:0 0;cursor:inherit}
.canvas-nodes .node{pointer-events:auto}
.lines-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:1;overflow:visible;cursor:inherit}
/* shape-rendering: geometricPrecision tells the browser to prioritize
   geometric accuracy over speed when rasterizing paths — avoids the
   sub-pixel approximation that causes blur under transform scaling.
   text-rendering: geometricPrecision does the same for label text. */
.lines-svg path{shape-rendering:geometricPrecision}
.line-label{text-rendering:geometricPrecision}
.line{fill:none;stroke-width:calc(2.5 * var(--line-scale, 1));stroke-linecap:round;pointer-events:stroke;cursor:pointer;opacity:.6;transition:opacity .15s,stroke-width .15s}
.line:hover{opacity:1;stroke-width:calc(3.5 * var(--line-scale, 1))}
.line.hover{opacity:1;stroke-width:calc(3.5 * var(--line-scale, 1))}
.line.selected{opacity:1;stroke-width:calc(4 * var(--line-scale, 1));filter:drop-shadow(0 0 4px rgba(59,130,246,.55))}
.line.temp{stroke-dasharray:6 4;opacity:.8}
.line.s-blue{stroke:#3b82f6}.line.s-cyan{stroke:#06b6d4}
.line.s-green{stroke:#10b981}.line.s-yellow{stroke:#eab308}
.line.s-orange{stroke:#f97316}
/* Connection label — sits on the line midpoint, layered above the path
   (labelsGroup is appended after linesGroup in _doRenderLines). The
   1px white stroke halo (paint-order: stroke fill) keeps the text
   legible where the line passes underneath. font-size transitions
   smoothly between default (10) and the selected/hover state (12). */
.line-label{paint-order:stroke fill;stroke:#fff;stroke-width:1px;stroke-linejoin:round;pointer-events:all;cursor:pointer;user-select:none;transition:stroke-width .15s ease}
/* Selected / hover: thicker halo only — NO font-size change. The base
   font-size is set as an SVG attribute (10 * scale) in _doRenderLines
   so labels scale with zoom (matching node text). A CSS font-size here
   would override that attribute and break zoom scaling (label would
   stay fixed-size while everything else zooms). */
.line-label.selected,
.line-label.hover{stroke-width:2px}
.coord{position:absolute;bottom:6px;left:6px;z-index:50;font-size:12.5px;color:var(--text-muted);background:var(--bg-card);padding:5px 9px;border-radius:4px;border:1px solid var(--border);font-family:'Inter',monospace;user-select:none;line-height:1.4;cursor:pointer}
.coord .coord-val{display:inline;outline:none;user-select:text;cursor:text;border-radius:3px;padding:1px 3px;min-width:1em}
.coord .coord-val:focus{background:transparent;border:1px solid var(--border);outline:1px solid rgba(59,130,246,.55);outline-offset:0;margin:-1px}
.coord .coord-sep{color:var(--text-muted);user-select:none}
.sel-overlay{position:absolute;border:2px dashed var(--accent);background:var(--accent-bg);pointer-events:none;z-index:100}
.curve-overlay{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:100}
.canvas.drag-over{background:var(--accent-bg);outline:3px dashed var(--accent);outline-offset:-3px}
.canvas.read-only{cursor:default}
.canvas.read-only .node-header{cursor:default}
.canvas.read-only .node-header:active{cursor:default}

.canvas.read-only .node-close{display:none}
.canvas.read-only .node-clear{visibility:hidden}
.canvas.read-only .node-body{cursor:default}
.canvas.read-only .line{cursor:default}

.node{position:absolute;background:var(--bg-card);border-radius:12px;border:1px solid rgba(0,0,0,.18);box-sizing:border-box;box-shadow:0 6px 20px rgba(0,0,0,.06);cursor:default;transition:box-shadow .2s;user-select:none;z-index:2;will-change:transform;width:170px}
.node.dragging{transition:none;cursor:grabbing;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:20}
.node:hover{box-shadow:0 6px 20px rgba(0,0,0,.13)}
.node.selected{outline:2px solid var(--accent);outline-offset:2px}
.node-close{position:absolute;top:-10px;right:-10px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#999;font-size:14px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);transition:all .3s;z-index:3;visibility:hidden;opacity:0}
.node:hover .node-close{visibility:visible;opacity:1}
.node-body:hover .node-close{visibility:hidden;opacity:0}
.node-close:hover{background:rgba(231,76,60,.12);color:#e74c3c;transform:scale(1.15)}
.node-close:active{transform:scale(.95)}
.node-header{height:34px;box-sizing:border-box;padding:10px 14px;color:#fff;font-size:12px;font-weight:500;letter-spacing:.3px;display:flex;align-items:center;gap:8px;border-radius:12px 12px 0 0;cursor:grab;user-select:none;overflow:hidden;line-height:1;transform:translateZ(0)}
.node-header:active{cursor:grabbing}
.node-header.h-blue{background:linear-gradient(135deg,#3b82f6,#2563eb);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.node.dragging .node-header{cursor:grabbing}
.node-header.h-cyan{background:linear-gradient(135deg,#06b6d4,#0891b2);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.node-header.h-green{background:linear-gradient(135deg,#10b981,#059669);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.node-header.h-yellow{background:linear-gradient(135deg,#eab308,#ca8a04);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.node-header.h-orange{background:linear-gradient(135deg,#f97316,#ea580c);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.node-body{height:44px;box-sizing:border-box;padding:12px 14px;font-size:13px;color:var(--text-primary);min-width:0;overflow:visible;display:flex;align-items:center;justify-content:flex-start;gap:8px;border:none;border-radius:0 0 12px 12px;cursor:pointer;transition:background .15s;position:relative}
.node-body:hover{background:var(--bg-hover)}
.node-val{flex:1 1 auto;overflow:hidden;white-space:pre-wrap;word-break:break-all;text-align:left;min-width:0;max-width:110px;font-size:11px;line-height:1.35;max-height:2.7em;position:relative;scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.15) transparent}
.node-val::-webkit-scrollbar{width:2px!important;height:2px!important}
.node-val::-webkit-scrollbar-track{background:transparent!important;border:none!important}
.node-val::-webkit-scrollbar-thumb{background:rgba(128,128,128,.15)!important;border-radius:1px}
.node-val::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.3)!important}
.node-val::-webkit-scrollbar-button{display:none!important}
.node-val::-webkit-scrollbar-corner{display:none!important}
.node-empty{color:var(--text-muted);font-style:italic;font-size:10px;pointer-events:none}
.node-clear{flex-shrink:0;margin-left:auto;width:20px;height:20px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px;cursor:pointer;visibility:hidden;transition:all .15s;border:none;font-family:inherit}
.node-body:hover .node-clear{visibility:visible}
.node-clear:hover{background:rgba(231,76,60,.12);color:#e74c3c}
.node-body.has-overflow::after{content:'…';position:absolute;left:124px;top:22px;font-size:11px;line-height:1.35;color:var(--text-primary);background:transparent;padding:0 2px;pointer-events:none}

.socket{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--bg-card);border:2px solid;top:50%;transform:translateY(-50%);z-index:4;cursor:crosshair;transition:transform .15s,box-shadow .15s}
.socket:hover{transform:translateY(-50%) scale(1.35);box-shadow:0 0 10px rgba(59,130,246,.35)}
.socket.dragging{transform:translateY(-50%) scale(1.6);box-shadow:0 0 16px rgba(59,130,246,.5)}
.socket.in{left:-8px}.socket.out{right:-8px}
.socket.s-blue{border-color:#3b82f6}.socket.s-cyan{border-color:#06b6d4}
.socket.s-green{border-color:#10b981}.socket.s-yellow{border-color:#eab308}
.socket.s-orange{border-color:#f97316}
.socket-inner{width:8px;height:8px;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.socket.s-blue .socket-inner{background:#3b82f6}.socket.s-cyan .socket-inner{background:#06b6d4}
.socket.s-green .socket-inner{background:#10b981}.socket.s-yellow .socket-inner{background:#eab308}
.socket.s-orange .socket-inner{background:#f97316}

#inlineEdit{position:fixed;z-index:500;display:none}
#inlineEdit input{background:#fff;border:2px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:11px;width:130px;outline:none;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#inlineEdit textarea{background:#fff;border:2px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:11px;width:180px;min-height:28px;outline:none;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.1);resize:vertical}

#ctx{position:fixed;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:4px;display:none;z-index:410;min-width:100px;box-shadow:var(--shadow-lg)}
#ctx button{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 10px;color:var(--text-secondary);font-size:11px;cursor:pointer;border-radius:4px;font-family:inherit}
#ctx button:hover{background:var(--bg-hover);color:var(--text-primary)}
#ctx .sep2{border-top:1px solid var(--border);margin:3px 6px}
#ctx .del{color:#dc2626}
#ctx .del:hover{background:#fef2f2;color:#dc2626}

#nodeTip{position:fixed;z-index:500;display:none;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:var(--shadow-lg);max-width:280px;max-height:200px;overflow-y:auto;word-break:break-all;white-space:pre-wrap;line-height:1.4;color:var(--text-primary);pointer-events:none}
#nodeTip::-webkit-scrollbar{width:2px}#nodeTip::-webkit-scrollbar-thumb{background:rgba(128,128,128,.15);border-radius:1px}
#descEdit{position:fixed;z-index:510;display:none;background:var(--bg-card);border:1px solid var(--accent);border-radius:8px;padding:8px;box-shadow:var(--shadow-lg)}
#descEdit textarea{display:block;width:260px;min-height:60px;max-height:180px;border:none;outline:none;background:transparent;font-size:11px;font-family:inherit;color:var(--text-primary);resize:none;line-height:1.4;white-space:pre-wrap;word-break:break-all} 

#modal{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;display:none;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal.on{display:flex}
#modalBox{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;width:340px;box-shadow:var(--shadow-lg);transform:scale(1.25);transform-origin:center center}
#modalBox h3{font-size:14px;font-weight:600;margin-bottom:12px}
#modalBox label{display:block;font-size:10px;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
#modalBox input,#modalBox textarea{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text-primary);font-size:12px;margin-bottom:10px;font-family:inherit;outline:none;transition:.15s}
#modalBox input:focus,#modalBox textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-light)}
#modalBox textarea{min-height:40px;resize:vertical}
#modalBtns{display:flex;gap:8px;justify-content:flex-end}
#modalBtns button{padding:5px 14px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg-input);color:var(--text-secondary);transition:.15s}
#modalBtns button:hover{background:var(--bg-hover);color:var(--text-primary)}
#modalBtns button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
#modalBtns button.p:hover{background:var(--accent-hover)}

.layout{display:flex;flex-direction:column;height:100vh}
.canvas-wrap{flex:1;display:flex;min-height:0}
.sidebar{width:52px;background:var(--bg-card);border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;flex-shrink:0;z-index:60}
.sidebar-btn{width:36px;height:36px;padding:0;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);background:var(--bg-input);color:var(--text-secondary);transition:all .2s;font-family:inherit;user-select:none}
.sidebar-btn:hover{background:var(--bg-hover);border-color:var(--border-light);color:var(--text-primary)}
.sidebar-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.sidebar-btn svg{width:16px;height:16px}
.sidebar-bottom{margin-top:auto}

/* ── Custom color picker modal ── */
#cpModal{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:400;display:none;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#cpModal.on{display:flex}
#cpModalBox{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;width:340px;box-shadow:var(--shadow-lg)}
#cpModalBox h3{font-size:14px;font-weight:600;margin-bottom:12px}
.m-cp-wheel-wrap{position:relative;width:fit-content;margin:0 auto;line-height:0}
.m-cp-wheel-wrap canvas{border-radius:50%;cursor:crosshair;display:block}
.m-cp-dot{position:absolute;width:10px;height:10px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.35);pointer-events:none;transform:translate(-50%,-50%)}
.m-cp-preview{flex-shrink:0}
.m-cp-btns{display:flex;gap:6px;justify-content:flex-end}
.m-cp-btns button{padding:5px 14px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg-input);color:var(--text-secondary);transition:.15s}
.m-cp-btns button:hover{background:var(--bg-hover);color:var(--text-primary)}
.m-cp-btns button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.m-cp-btns button.p:hover{background:var(--accent-hover)}

/* ── About modal ── */
#aboutModal{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:350;display:none;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#aboutModal.on{display:flex}
#aboutModalBox{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;width:340px;box-shadow:var(--shadow-lg);transform:scale(1.25);transform-origin:center center}
#aboutModalBox h3{font-size:14px;font-weight:600;margin-bottom:14px}
.about-content{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.about-icon{width:48px;height:48px;margin:0 auto 6px;border-radius:12px;background:var(--bg-input);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.about-icon svg{width:24px;height:24px;color:var(--accent)}
.about-row{display:flex;align-items:center;font-size:12px;line-height:1.6}
.about-row label{width:80px;flex-shrink:0;color:var(--text-muted);font-weight:500}
.about-row span,.about-row a{color:var(--text-primary)}
.about-row a{color:var(--accent);text-decoration:none}
.about-row a:hover{text-decoration:underline}
.about-row .muted{color:var(--text-muted)}
#aboutBtns{display:flex;gap:8px;justify-content:flex-end}
#aboutBtns button{padding:5px 14px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg-input);color:var(--text-secondary);transition:.15s}
#aboutBtns button:hover{background:var(--bg-hover);color:var(--text-primary)}

/* ── Modal color dots ── */
.m-dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s;flex-shrink:0}
.m-dot:hover{transform:scale(1.15)}
.m-dot.active{border-color:#1a1d24;box-shadow:0 0 0 2px var(--accent-light)}
.m-wheel-btn{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;cursor:pointer;transition:transform .15s;overflow:hidden;position:relative;padding:0;flex-shrink:0}
.m-wheel-btn:hover{transform:scale(1.15)}
.m-wheel-btn::before{content:'';position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,hsl(0,70%,75%),hsl(90,70%,75%),hsl(180,70%,75%),hsl(270,70%,75%),hsl(360,70%,75%))}
.m-wheel-btn::after{content:'';position:absolute;inset:2px;border-radius:50%;background:#fff}
.m-wheel-btn svg{position:absolute;inset:0;margin:auto;width:12px;height:12px;color:var(--text-muted)}

/* ── Node generation color picker dropdown ── */
#genColorDropdown{position:relative;display:inline-flex;align-items:center}
.g-trigger-btn{padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg-input);color:var(--text-secondary);transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-family:inherit;user-select:none;flex-shrink:0}
.g-trigger-btn:hover{background:var(--bg-hover);border-color:var(--border-light);color:var(--text-primary)}
.g-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;position:relative;top:1.5px;background:#3b82f6}
#genColorPanel{position:absolute;top:100%;left:0;margin-top:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-lg);z-index:510;visibility:hidden;opacity:0;transition:opacity .15s,visibility .15s}

#genColorPanel.open{visibility:visible;opacity:1}
#genColorPanel .g-panel-wheel{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:#fff;cursor:pointer;overflow:hidden;position:relative;padding:0;flex-shrink:0;margin:0 auto 10px;display:block;transition:transform .15s}
#genColorPanel .g-panel-wheel:hover{transform:scale(1.1)}
#genColorPanel .g-panel-wheel::before{content:'';position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,hsl(0,70%,75%),hsl(90,70%,75%),hsl(180,70%,75%),hsl(270,70%,75%),hsl(360,70%,75%))}
#genColorPanel .g-panel-wheel::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#fff}
#genColorPanel .g-panel-wheel svg{position:absolute;inset:0;margin:auto;width:18px;height:18px;color:var(--text-muted)}
.g-dot-wrap{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:center}
.g-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s;flex-shrink:0}
.g-dot:hover{transform:scale(1.15)}
.g-dot.active{border-color:#1a1d24;box-shadow:0 0 0 2px var(--accent-light)}

</style>
</head>

<script>
const PRESET_COLORS = [
   { id:'blue',  hex:'#3b82f6', start:'#3b82f6', end:'#2563eb' },
   { id:'cyan',  hex:'#06b6d4', start:'#06b6d4', end:'#0891b2' },
   { id:'green', hex:'#10b981', start:'#10b981', end:'#059669' },
   { id:'yellow',hex:'#eab308', start:'#eab308', end:'#ca8a04' },
   { id:'orange',hex:'#f97316', start:'#f97316', end:'#ea580c' }
];
const COLORS = PRESET_COLORS.map(c => c.id);
const COLOR_HEX = Object.fromEntries(PRESET_COLORS.map(c => [c.id, c.hex]));
const LEGACY_COLOR_MAP = {amber:'yellow',rose:'orange',teal:'cyan',violet:'blue',default:'blue'};

const NODE_W = 170;
const NODE_H = 78;
const SOCKET_Y = 40;
const GRID = 20;
const GRID_PX = 20;
// Connection test radius (world coords). 14px > visual socket radius (8px),
// keeps interaction comfortable at common zoom levels (0.5x–2x). At extreme
// zooms (0.15x/5x) the hit area becomes too small/large, but users rarely
// perform connections at those levels.
const SOCKET_HIT_RADIUS = 14;

const WORLD_CENTER_X = 0;
const WORLD_CENTER_Y = 0;
const COL_X = [WORLD_CENTER_X - 300, WORLD_CENTER_X, WORLD_CENTER_X + 300, WORLD_CENTER_X + 600];
const START_Y = WORLD_CENTER_Y - 60;

const App = window.App = {
  canvasState: { nodes: [], connections: [], history: [] },
  dragState: null,
  isDragging: false,
  socketDragState: null,
  panX: 0,
  panY: 0,
  scale: 1,
  selectedNodeIds: new Set(),
  canvasPanState: null,
  canvasBoxState: null,
  canvasHistoryIndex: -1,
  _canvasHistoryMax: 50,
  _linesRaf: null,
  _renderFilter: null,
  /* Spatial grid chunk index for incremental pan rendering */
  _cellSize: 500,
  _nodeCells: null,
  _connByNode: null,
  _connKeyMap: null,
  _lastVisibleCells: null,
  _lastRenderScale: 1,
  _resolveColorCache: null,
  _forceRerenderPending: false,
  _modalNodeId: null,
  _inlineEditTarget: null,
  _ctxNodeId: null,

  _ctxConnKey: null,
  // Currently selected connection key (string "from|to") or null.
  // Single-selection: connections don't support multi-select. Clicking a
  // connection selects it (clearing any node selection); clicking a node or
  // canvas blank clears it. Delete key removes the selected connection.
  selectedConnKey: null,
  _curveEditState: null,
  _customColors: [],
  _cpState: null,
  _cpEls: null,
  _cpOnConfirm: null,
  _wheelImageData: null,
  _selectedGenColor: null,
  readOnly: false,
  _autoOpenModal: false,
  _zOrderDirty: false,
  // Anchor-based addNode layout: the first addNode call anchors at the
  // current viewport center. Each subsequent call while the center is
  // UNCHANGED increments a counter and offsets to the right; if the user
  // pans so the center moves, the anchor is re-recorded and counter resets.
  _lastAddCenterX: null,
  _lastAddCenterY: null,
  _addCounter: 0,

  /* DOM element cache */
  _els: {},
  _getEl(id) { if (!this._els[id]) { this._els[id] = document.getElementById(id); } return this._els[id]; },
  _nodeElMap: new Map(),
  /* Z-order array (front to back) */
  _nodeZOrder: [],
  /* Cached container dimensions */
  _cachedCW: 0,
  _cachedCH: 0,

  NODE_W: NODE_W,
  GRID: GRID,

  escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  },

  /* ── Color helpers ── */
  hslToRgb(h, s, l) { s /= 100; l /= 100; const a = s * Math.min(l, 1 - l); const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); }; return { r: Math.round(f(0) * 255), g: Math.round(f(8) * 255), b: Math.round(f(4) * 255) }; },
  rgbToHsl(r, g, b) { r /= 255; g /= 255; b /= 255; const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2; let h = 0, s = 0; if (max !== min) { const d = max - min; s = l > .5 ? d / (2 - max - min) : d / (max + min); switch (max) { case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break; case g: h = ((b - r) / d + 2) / 6; break; case b: h = ((r - g) / d + 4) / 6; break; } } return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) }; },
  shadeColor(hex, amt) { let v = parseInt(hex.replace('#', ''), 16); let r = Math.max(0, Math.min(255, (v >> 16) + amt)), g = Math.max(0, Math.min(255, (v >> 8 & 0xff) + amt)), b = Math.max(0, Math.min(255, (v & 0xff) + amt)); return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); },
  hexToRgb(h) { const v = parseInt(h.replace('#', ''), 16); return { r: (v >> 16) & 0xff, g: (v >> 8) & 0xff, b: v & 0xff }; },
  rgbToHex(r, g, b) { return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1); },
  debounce(fn, ms) { let t; return function(...a) { clearTimeout(t); const c=this; t=setTimeout(()=>fn.apply(c,a),ms); }; },
  showToast(msg, type, dur) { type=type||'success'; dur=dur||3000; const c=document.getElementById('toastContainer'); Array.from(c.children).forEach(el=>{if(el._f){el.remove()}});if(c.children.length>=6){const o=c.firstElementChild;o._f=1;o.classList.remove('show');setTimeout(()=>{if(o.parentNode)o.remove()},300)} const el=document.createElement('div'); el.className='toast '+type; const d=document.createElement('div'); d.textContent=msg; el.appendChild(d); c.appendChild(el); requestAnimationFrame(()=>{requestAnimationFrame(()=>{el.classList.add('show')})}); setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},dur); },



  _resolveColor(hexOrId) {
    if (!this._resolveColorCache) this._resolveColorCache = new Map();
    const cached = this._resolveColorCache.get(hexOrId);
    if (cached) return cached;
    let result;
    if (COLORS.includes(hexOrId)) { const p = PRESET_COLORS.find(c => c.id === hexOrId); result = { cls: hexOrId, hex: p.hex, isPreset: true }; }
    else if (LEGACY_COLOR_MAP[hexOrId]) { const id = LEGACY_COLOR_MAP[hexOrId]; const p = PRESET_COLORS.find(c => c.id === id); result = { cls: id, hex: p.hex, isPreset: true }; }
    else if (/^#[0-9a-fA-F]{6}$/.test(hexOrId)) { const p = PRESET_COLORS.find(c => c.hex.toLowerCase() === hexOrId.toLowerCase()); if (p) result = { cls: p.id, hex: p.hex, isPreset: true }; else result = { hex: hexOrId, shadeHex: this.shadeColor(hexOrId, -35), isPreset: false }; }
    else result = { cls: 'blue', hex: COLOR_HEX.blue, isPreset: true };
    this._resolveColorCache.set(hexOrId, result);
    return result;
  },

  _loadCustomColors() {
    try { this._customColors = (JSON.parse(localStorage.getItem('flow_custom_colors')) || []).filter(c => /^#[0-9a-fA-F]{6}$/.test(c)); } catch(e) { console.warn('Failed to load custom colors:', e); this._customColors = []; }
  },
  _saveCustomColors() {
    try { localStorage.setItem('flow_custom_colors', JSON.stringify(this._customColors)); } catch(e) { console.warn('Failed to save custom colors:', e); }
  },

  _cycleNodeColors(dir) {
    this._loadCustomColors();
    const allColors = [...COLORS, ...this._customColors];
    if (allColors.length < 2) return;
    let idx = allColors.indexOf(this._selectedGenColor);
    if (idx < 0) idx = 0;
    idx = (idx + dir + allColors.length) % allColors.length;
    this._setGenColor(allColors[idx]);
  },

  _refreshContainerCache() {
    const c = this._getEl('canvasStage');
    if (c) { this._cachedCW = c.clientWidth; this._cachedCH = c.clientHeight; }
  },

  // Screen coords → world coords. Derivation: screenX = worldX * scale + panX
  getWorldPos(clientX, clientY) {
    const c = this._getEl('canvasStage');
    if (!c) return { x: 0, y: 0 };
    const rect = c.getBoundingClientRect();
    return {
      x: (clientX - rect.left - this.panX) / this.scale,
      y: (clientY - rect.top - this.panY) / this.scale
    };
  },

  // ── Undo / Save ──
  // Save current node/connection state to the history stack. Called after every
  // data mutation (add/delete/drag/edit). If the stack is not at the latest
  // position (after undo), discard the entries ahead of the current position.
  saveCanvasSnapshot() {
    const snapshot = {
      nodes: structuredClone(this.canvasState.nodes),
      connections: structuredClone(this.canvasState.connections)
    };
    if (this.canvasHistoryIndex < this.canvasState.history.length - 1) {
      this.canvasState.history = this.canvasState.history.slice(0, this.canvasHistoryIndex + 1);
    }
    this.canvasState.history.push(snapshot);
    if (this.canvasState.history.length > this._canvasHistoryMax) {
      this.canvasState.history.shift();
    }
    this.canvasHistoryIndex = this.canvasState.history.length - 1;
    this.updateCanvasUndoButtons();
    this.saveCanvas();
  },

  _serializeData() {
    return {
      nodes: this.canvasState.nodes.map(n => ({
        ...n,
        x: Math.round(n.x / GRID_PX),
        y: Math.round(n.y / GRID_PX)
      })),
      connections: this.canvasState.connections.map(c => {
        const o = { from: c.from, to: c.to, label: c.label };
        if (c.cp1) o.cp1 = c.cp1;
        if (c.cp2) o.cp2 = c.cp2;
        return o;
      }),
      viewport: { panX: this.panX, panY: this.panY, scale: this.scale }
    };
  },

  _updateStatusBadge() {
    const badge = document.getElementById('statusBadge');
    if (!badge) return;
    const nc = this.canvasState.nodes.length;
    const cc = this.canvasState.connections.length;
    badge.textContent = nc + ' 节点 · ' + cc + ' 连线';
  },

  _showDescEdit(nodeId) {
    if (this.readOnly) return;
    const node = this.canvasState.nodes.find(n => n.id === nodeId);
    const nodeEl = this._nodeElMap.get(nodeId);
    if (!node || !nodeEl) return;
    this._descEditNodeId = nodeId;
    const rect = nodeEl.getBoundingClientRect();
    const el = document.getElementById('descEdit');
    const ta = document.getElementById('descEditTa');
    if (!el || !ta) return;
    ta.value = node.desc || '';
    let left = rect.left + rect.width / 2 - 140;
    let top = rect.bottom + 8;
    if (left < 4) left = 4;
    if (left + 280 > innerWidth - 4) left = innerWidth - 284;
    if (top + 200 > innerHeight) top = rect.top - 200 - 8;
    if (top < 4) top = 4;
    el.style.cssText = 'display:block;left:' + left + 'px;top:' + top + 'px';
    ta.focus();
    this._descEditBlur = () => { this._saveDescEdit(); };
    this._descEditKeydown = (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') { e.preventDefault(); this._closeDescEdit(); this.renderCanvas(); }
    };
    ta.addEventListener('blur', this._descEditBlur);
    ta.addEventListener('keydown', this._descEditKeydown);
  },

  _saveDescEdit() {
    const node = this.canvasState.nodes.find(n => n.id === this._descEditNodeId);
    if (!node) return;
    const ta = document.getElementById('descEditTa');
    if (!ta) return;
    node.desc = ta.value;
    this.saveCanvasSnapshot();
    this.renderCanvas();
    this._closeDescEdit();
  },

  _closeDescEdit() {
    const el = document.getElementById('descEdit');
    const ta = document.getElementById('descEditTa');
    if (el) el.style.display = 'none';
    if (ta && this._descEditBlur) ta.removeEventListener('blur', this._descEditBlur);
    if (ta && this._descEditKeydown) ta.removeEventListener('keydown', this._descEditKeydown);
    this._descEditNodeId = null;
    this._descEditBlur = null;
    this._descEditKeydown = null;
  },

  saveCanvas() {
    try {
      localStorage.setItem('flow_data', JSON.stringify(this._serializeData()));
    } catch (e) { /* ignore */ }
  },

  debouncedAutoSave: null,

  canvasUndo() {
    if (this.canvasHistoryIndex <= 0) return;
    this.canvasHistoryIndex--;
    this._restoreCanvasSnapshot(this.canvasState.history[this.canvasHistoryIndex]);
    this.updateCanvasUndoButtons();
  },

  canvasRedo() {
    if (this.canvasHistoryIndex >= this.canvasState.history.length - 1) return;
    this.canvasHistoryIndex++;
    this._restoreCanvasSnapshot(this.canvasState.history[this.canvasHistoryIndex]);
    this.updateCanvasUndoButtons();
  },

  _restoreCanvasSnapshot(snapshot) {
    this.canvasState.nodes = structuredClone(snapshot.nodes);
    this.canvasState.connections = structuredClone(snapshot.connections);
    this.selectedNodeIds.clear();
    this._nodeZOrder = this.canvasState.nodes.map(n => n.id);
    this._zOrderDirty = true;
    // Reset the add-anchor so undo→add doesn't try to place a node at a
    // stale anchor that no longer matches the current viewport center.
    this._lastAddCenterX = null;
    this._lastAddCenterY = null;
    this._addCounter = 0;
    this.renderCanvas({ center: false });
  },

  updateCanvasUndoButtons() {
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    if (undoBtn) undoBtn.disabled = !(this.canvasHistoryIndex > 0);
    if (redoBtn) redoBtn.disabled = !(this.canvasHistoryIndex < this.canvasState.history.length - 1);
  },

  toggleReadOnly() {
    this.readOnly = !this.readOnly;
    const sideBtn = document.getElementById('sidebarReadOnlyBtn');
    if (sideBtn) sideBtn.classList.toggle('active', this.readOnly);
    this._getEl('canvasStage').classList.toggle('read-only', this.readOnly);
    if (this._inlineEditTarget) this.closeInlineEdit();
    this.showToast(this.readOnly ? '已切换至只读模式' : '已切换至编辑模式');
  },

  showAbout() {
    document.getElementById('aboutModal').classList.add('on');
  },
  closeAbout() {
    document.getElementById('aboutModal').classList.remove('on');
  },

  // ── Canvas Events ──
  onCanvasMouseDown(e) {
    const container = this._getEl('canvasStage');
    if (e.button === 0 && e.shiftKey) {
      e.preventDefault();
      if (this.canvasBoxState) { this.finalizeBoxSelect(); return; }
      const wp = this.getWorldPos(e.clientX, e.clientY);
      this.canvasBoxState = { startX: wp.x, startY: wp.y, curX: wp.x, curY: wp.y };
      document.getElementById('boxSelectOverlay').style.display = 'block';
    } else if (e.button === 0) {
      // Clicking canvas blank (not on a node/line) clears connection selection.
      this._clearConnSelection();
      this._refreshContainerCache();
      this.canvasPanState = { startX: e.clientX, startY: e.clientY, origPanX: this.panX, origPanY: this.panY };
      container.classList.add('grabbing');
    } else if (e.button === 1) {
      e.preventDefault();
      this._refreshContainerCache();
      this.canvasPanState = { startX: e.clientX, startY: e.clientY, origPanX: this.panX, origPanY: this.panY };
      container.classList.add('grabbing');
    }
  },

  finalizeBoxSelect() {
    if (!this.canvasBoxState) return;
    const lx = Math.min(this.canvasBoxState.startX, this.canvasBoxState.curX);
    const ly = Math.min(this.canvasBoxState.startY, this.canvasBoxState.curY);
    const rx = Math.max(this.canvasBoxState.startX, this.canvasBoxState.curX);
    const ry = Math.max(this.canvasBoxState.startY, this.canvasBoxState.curY);
    this.selectedNodeIds.clear();
    this.canvasState.nodes.forEach(n => {
      const nx = n.x || 0, ny = n.y || 0;
      if (nx + NODE_W >= lx && nx <= rx && ny + NODE_H >= ly && ny <= ry) this.selectedNodeIds.add(n.id);
    });
    this.canvasBoxState = null;
    const overlay = document.getElementById('boxSelectOverlay');
    if (overlay) overlay.style.display = 'none';
    this._boxSelectJustCompleted = true;
    this.renderCanvas({ center: false });
  },

  onCanvasWheel(e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const now = Date.now();
      if (this._lastCycleTime && now - this._lastCycleTime < 100) return;
      this._lastCycleTime = now;
      const dir = e.deltaY < 0 ? 1 : -1;
      const before = this._selectedGenColor;
      this._cycleNodeColors(dir);
      // Only push a notification if the color actually changed.
      // _cycleNodeColors returns early when there are <2 colors.
      if (this._selectedGenColor && this._selectedGenColor !== before) {
        const rc = this._resolveColor(this._selectedGenColor);
        this.showToast('已切换 → ' + (rc.isPreset ? {blue:'蓝色',cyan:'青色',green:'绿色',yellow:'黄色',orange:'橙色'}[rc.cls] : rc.hex), 'info');
      }
      return;
    }
    const container = this._getEl('canvasStage');
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
    const oldScale = this.scale;
    const delta = e.deltaY > 0 ? 0.95 : 1.05;
    this.scale = Math.min(5, Math.max(0.15, this.scale * delta));
    const worldMouseX = (mouseX - this.panX) / oldScale;
    const worldMouseY = (mouseY - this.panY) / oldScale;
    this.panX = mouseX - worldMouseX * this.scale;
    this.panY = mouseY - worldMouseY * this.scale;
    this._refreshContainerCache();
    this.clampPan();
    if (this.canvasPanState) {
      this.canvasPanState.origPanX = this.panX; this.canvasPanState.origPanY = this.panY;
      this.canvasPanState.startX = e.clientX; this.canvasPanState.startY = e.clientY;
    }
    if (this.dragState) {
      const wp = this.getWorldPos(e.clientX, e.clientY);
      this.dragState.startWorldX = wp.x; this.dragState.startWorldY = wp.y;
      for (const n of this.dragState.nodes) {
        const cur = this.canvasState.nodes.find(nn => nn.id === n.id);
        if (cur) { n.origX = cur.x; n.origY = cur.y; }
      }
    }
    // No special handling for socketDragState here — it stores world
    // coords (scale-invariant), so zoom doesn't invalidate it. The
    // renderLines call below will recompute the temp line at the new
    // scale automatically. This is the key benefit of data-driven
    // rendering: zoom-during-drag just works.
    this.applyViewTransform();
    this.debouncedAutoSave();
  },

  // ── View Transform ──

  /*
   * View transform: three-layer separation
   *
   * 1. .canvas-world → translate(panX, panY)
   *    GPU-composited pan — translate changes only, no reflow, optimal performance.
   *    Panning does not change scale, so SVG paths (pre-multiplied by scale) stay correct.
   *
   * 2. .canvas-nodes → scale(scale)
   *    Scale changes trigger force re-rasterization (_forceRerender) for crisp node text.
   *
   * 3. SVG connection path `d` = world coords × scale (pre-multiplied)
   *    NO CSS/SVG transform — avoids the browser caching SVG as a GPU texture
   *    which would blur when scaled. renderLines() rewrites path geometry on every
   *    zoom change, guaranteeing 1:1 rasterization.
   */
  applyViewTransform() {
    // Step 1 pan: GPU compositor layer
    const world = document.getElementById('canvasWorld');
    if (world) world.style.transform = 'translate(' + this.panX + 'px,' + this.panY + 'px)';

    // Step 2 zoom: transform scale, creates a new compositor layer
    const nodesC = document.getElementById('canvasNodes');
    if (nodesC) nodesC.style.transform = 'scale(' + this.scale + ')';

    // Step 3 change >3% → force re-rasterization for crisp node text
    const scaleDiff = Math.abs(this.scale - this._lastRenderScale);
    if (scaleDiff > 0.03) {
      this._lastRenderScale = this.scale;
      this._forceRerender();
    }

    // Step 4 connection SVG: re-render paths
    this.renderLines();

    // Step 5 grid canvas: pixel-aligned drawing
    this._drawGrid();

    // Step 6 coordinate HUD update
    this.updateCoordDisplay();
  },

  /*
   * Grid drawn via Canvas 2D in screen-pixel space.
   * Lines are snapped to integer pixels — no anti-aliasing bleed,
   * no sub-pixel merging, no thickness flicker at any zoom level.
   * Minor grid (step=20) shown when spacing >= 8px; major grid (step=100) always shown.
   */
  _drawGrid() {
    const container = this._getEl('canvasStage');
    if (!container) return;
    const cvs = document.getElementById('gridCvs');
    if (!cvs) return;

    const dpr = window.devicePixelRatio || 1;
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    if (cw === 0 || ch === 0) return;  // container not yet laid out — will retry on next call

    const bufW = Math.round(cw * dpr);
    const bufH = Math.round(ch * dpr);
    if (cvs.width !== bufW || cvs.height !== bufH) {
      cvs.width = bufW;
      cvs.height = bufH;
    }

    const ctx = cvs.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.lineWidth = 1;

    const minorStep = GRID;
    const majorStep = GRID * 5;
    const minorScreenSpacing = minorStep * this.scale;
    const majorScreenSpacing = majorStep * this.scale;

    /* Major grid — always visible */
    ctx.strokeStyle = 'rgba(200,204,213,0.6)';
    ctx.beginPath();
    const mFirstX = Math.floor((-this.panX / this.scale) / majorStep) * majorStep;
    const mFirstY = Math.floor((-this.panY / this.scale) / majorStep) * majorStep;
    if (!Number.isFinite(mFirstX) || !Number.isFinite(mFirstY)) return;
    for (let wx = mFirstX; ; wx += majorStep) {
      const sx = Math.round(wx * this.scale + this.panX) + 0.5;
      if (sx > cw) break;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, ch);
    }
    for (let wy = mFirstY; ; wy += majorStep) {
      const sy = Math.round(wy * this.scale + this.panY) + 0.5;
      if (sy > ch) break;
      ctx.moveTo(0, sy); ctx.lineTo(cw, sy);
    }
    ctx.stroke();

    /* Minor grid: only draw when spacing ≥ 8px to avoid visual noise at small zoom */
    if (minorScreenSpacing >= 8) {
      ctx.strokeStyle = 'rgba(200,204,213,0.35)';
      ctx.beginPath();
      const firstX = Math.floor((-this.panX / this.scale) / minorStep) * minorStep;
      const firstY = Math.floor((-this.panY / this.scale) / minorStep) * minorStep;
      if (!Number.isFinite(firstX) || !Number.isFinite(firstY)) return;
      for (let wx = firstX; ; wx += minorStep) {
        const sx = Math.round(wx * this.scale + this.panX) + 0.5;
        if (sx > cw) break;
        ctx.moveTo(sx, 0); ctx.lineTo(sx, ch);
      }
      for (let wy = firstY; ; wy += minorStep) {
        const sy = Math.round(wy * this.scale + this.panY) + 0.5;
        if (sy > ch) break;
        ctx.moveTo(0, sy); ctx.lineTo(cw, sy);
      }
      ctx.stroke();
    }
  },

  _forceRerender() {
    if (this._forceRerenderPending) return;
    this._forceRerenderPending = true;
    requestAnimationFrame(() => {
      this._forceRerenderPending = false;
      const nodes = document.getElementById('canvasNodes');
      if (!nodes) return;
      nodes.style.willChange = 'transform';
      const parent = nodes.parentNode;
      const next = nodes.nextSibling;
      parent.removeChild(nodes);
      parent.insertBefore(nodes, next);
      requestAnimationFrame(() => { nodes.style.willChange = ''; });
    });
  },

  updateCoordDisplay() {
    const c = this._getEl('canvasStage');
    if (!c) return;
    const cx = Math.round((-this.panX + c.clientWidth / 2) / this.scale);
    const cy = Math.round((-this.panY + c.clientHeight / 2) / this.scale);
    const guX = Math.round(cx / GRID_PX), guY = Math.round(cy / GRID_PX);
    const zp = Math.round(this.scale * 100);
    const elX = document.getElementById('coordX');
    const elY = document.getElementById('coordY');
    const elZ = document.getElementById('coordZ');
    if (elX && document.activeElement !== elX) elX.textContent = guX;
    if (elY && document.activeElement !== elY) elY.textContent = guY;
    if (elZ && document.activeElement !== elZ) elZ.textContent = zp + '%';
  },

  _initCoordEditable() {
    const elX = document.getElementById('coordX');
    const elY = document.getElementById('coordY');
    const elZ = document.getElementById('coordZ');
    if (!elX || elX.dataset.coordBound) return;
    elX.dataset.coordBound = '1';
    const self = this;
    const fields = [elX, elY, elZ];

    function saveOriginal(field) { field._orig = field.textContent; }
    function restoreOriginal(field) { field.textContent = field._orig; self.updateCoordDisplay(); }
    function applyField(field) {
      if (field.textContent === field._orig) return;
      const v = parseInt(field.textContent);
      if (isNaN(v)) { restoreOriginal(field); return; }
      const c = self._getEl('canvasStage');
      if (!c) { restoreOriginal(field); return; }
      if (field === elX) {
        const val = Math.min(5000, Math.max(-5000, v));
        field.textContent = val;
        self.panX = c.clientWidth / 2 - val * GRID_PX * self.scale;
      } else if (field === elY) {
        const val = Math.min(5000, Math.max(-5000, v));
        field.textContent = val;
        self.panY = c.clientHeight / 2 - val * GRID_PX * self.scale;
      } else {
        const val = Math.min(500, Math.max(15, v));
        field.textContent = val + '%';
        const newScale = val / 100;
        const cxc = c.clientWidth / 2, cyc = c.clientHeight / 2;
        const oldScale = self.scale;
        self.scale = newScale;
        self.panX = cxc - ((cxc - self.panX) / oldScale) * newScale;
        self.panY = cyc - ((cyc - self.panY) / oldScale) * newScale;
      }
      self.clampPan();
      self.applyViewTransform();
      self.saveCanvasSnapshot();
    }

    fields.forEach(function(field) {
      field.addEventListener('focus', function() { saveOriginal(this); });
      field.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); restoreOriginal(this); this.blur(); }
        if (e.key === 'Tab') {
          e.preventDefault();
          const idx = fields.indexOf(this);
          const next = fields[(idx + (e.shiftKey ? 2 : 1)) % 3];
          next.focus();
          // Select all text in the next field
          const sel = window.getSelection();
          sel.selectAllChildren(next);
        }
      });
      field.addEventListener('blur', function() { applyField(this); });
    });

    // Prevent canvas pan when interacting with coord
    const coordEl = document.getElementById('coord');
    if (coordEl) {
      coordEl.addEventListener('mousedown', function(e) { e.stopPropagation(); });
    }
  },

  /* Node click handler — supports Ctrl+click for multi-select */
  _nodeClick(e, nodeId) {
    if (e.ctrlKey || e.metaKey) {
      if (this.selectedNodeIds.has(nodeId)) this.selectedNodeIds.delete(nodeId);
      else this.selectedNodeIds.add(nodeId);
    } else {
      this.selectedNodeIds.clear();
      this.selectedNodeIds.add(nodeId);
    }
    // Selecting a node clears connection selection.
    this._clearConnSelection();
    this.renderCanvas();
  },

  clearAllNodes() {
    if (this.readOnly || this.canvasState.nodes.length === 0) return;
    if (!confirm('将清空页面节点信息，是否继续？')) return;
    this.canvasState.nodes = [];
    this.canvasState.connections = [];
    this.selectedNodeIds.clear();
    this._nodeElMap.forEach(el => el.remove());
    this._nodeElMap.clear();
    this.saveCanvasSnapshot();
    this.renderCanvas();
    this.showToast('已清空所有节点');
  },

  /* Clipboard for copy/paste */
  _clipboard: [],

  updateNodePositions() {
    for (const node of this.canvasState.nodes) {
      const el = this._nodeElMap.get(node.id);
      if (!el) continue;
      if (typeof node.x !== 'number' || isNaN(node.x)) node.x = WORLD_CENTER_X;
      if (typeof node.y !== 'number' || isNaN(node.y)) node.y = WORLD_CENTER_Y;
      el.style.transform = 'translate(' + node.x + 'px,' + node.y + 'px)';
    }
  },

  clampPan() {
    const cw = this._cachedCW, ch = this._cachedCH;
    if (cw === 0) {
      this._refreshContainerCache();
      if (this._cachedCW === 0) return;
      this.clampPan();
      return;
    }
    const ws = 20000 * this.scale, hs = 20000 * this.scale;
    const maxX = cw > ws ? cw / 2 : ws / 2;
    const minX = cw > ws ? cw / 2 : cw - ws / 2;
    const maxY = ch > hs ? ch / 2 : hs / 2;
    const minY = ch > hs ? ch / 2 : ch - hs / 2;
    this.panX = Math.min(maxX, Math.max(minX, this.panX));
    this.panY = Math.min(maxY, Math.max(minY, this.panY));
  },

  centerCanvasOnNodes() {
    const c = this._getEl('canvasStage');
    if (!c || this.canvasState.nodes.length === 0) { this.centerCanvasOnOrigin(); return; }
    if (c.clientWidth === 0 || c.clientHeight === 0) { setTimeout(() => this.centerCanvasOnNodes(), 50); return; }
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    this.canvasState.nodes.forEach(n => {
      const nx = n.x || 0, ny = n.y || 0;
      if (nx < minX) minX = nx; if (nx + NODE_W > maxX) maxX = nx + NODE_W;
      if (ny < minY) minY = ny; if (ny + NODE_H > maxY) maxY = ny + NODE_H;
    });
    const pad = 40, nodeW = maxX - minX, nodeH = maxY - minY;
    if (nodeW === 0 && nodeH === 0) {
      this.scale = 1;
      this.panX = c.clientWidth / 2 - minX - NODE_W / 2;
      this.panY = c.clientHeight / 2 - minY - 40;
    } else {
      const fitScaleX = nodeW > 0 ? (c.clientWidth - pad) / nodeW : 999;
      const fitScaleY = nodeH > 0 ? (c.clientHeight - pad) / nodeH : 999;
      const fitScale = Math.min(fitScaleX, fitScaleY);
      this.scale = Math.min(1.5, Math.max(0.3, fitScale));
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      this.panX = c.clientWidth / 2 - cx * this.scale;
      this.panY = c.clientHeight / 2 - cy * this.scale;
    }
    this._refreshContainerCache();
    this.applyViewTransform();
  },

  centerCanvasOnOrigin() {
    const c = this._getEl('canvasStage');
    if (!c) return;
    if (c.clientWidth === 0 || c.clientHeight === 0) { setTimeout(() => this.centerCanvasOnOrigin(), 50); return; }
    this.panX = c.clientWidth / 2 - WORLD_CENTER_X * this.scale;
    this.panY = c.clientHeight / 2 - WORLD_CENTER_Y * this.scale;
    this._refreshContainerCache();
    this.clampPan();
    this.applyViewTransform();
  },

  // ── Render Canvas (refactored: 1 orchestrator + 6 sub-methods) ──

  _prepCanvas() {
    const canvas = document.getElementById('canvasContainer');
    if (!canvas) return false;
    this._nodeElMap.forEach(el => { this._cancelSnapAnim(el); });
    return true;
  },

  _ensureCanvasSkeleton() {
    let nodesContainer = document.getElementById('canvasNodes');
    if (!nodesContainer) {
      this._els = {};
      document.getElementById('canvasContainer').innerHTML =
        '<div class="canvas" id="canvasStage">' +
          '<canvas id="gridCvs"></canvas>' +
          '<div class="canvas-world" id="canvasWorld">' +
            '<svg class="lines-svg" id="linesSvg" style="overflow:visible"></svg>' +
            '<div class="canvas-nodes" id="canvasNodes"></div>' +
            '<svg class="curve-overlay" id="curveOverlay" width="1" height="1" style="overflow:visible"></svg>' +
          '</div>' +
          '<div class="sel-overlay" id="boxSelectOverlay" style="display:none;"></div>' +
          '<div class="coord" id="coord">' +
            '<span class="coord-val" id="coordX" contenteditable="true">0</span>' +
            '<span class="coord-sep">, </span>' +
            '<span class="coord-val" id="coordY" contenteditable="true">0</span>' +
            '<span class="coord-sep"> | </span>' +
            '<span class="coord-val" id="coordZ" contenteditable="true">100%</span>' +
          '</div>' +
        '</div>';
      nodesContainer = this._getEl('canvasNodes');
      this._nodeElMap.clear();
      this._nodeZOrder = [];
    } else {
      const currentIds = new Set(this.canvasState.nodes.map(n => n.id));
      this._nodeElMap.forEach((el, id) => {
        if (!currentIds.has(id)) { el.remove(); this._nodeElMap.delete(id); }
      });
    }
    if (!this._getEl('curveOverlay')) {
      const co = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      co.setAttribute('id', 'curveOverlay');
      co.setAttribute('class', 'curve-overlay');
      co.setAttribute('width', '1');
      co.setAttribute('height', '1');
      const wd = this._getEl('canvasWorld');
      if (wd) wd.appendChild(co);
    }
    this._refreshContainerCache();
  },

  _renderNodes() {
    const nodesContainer = this._getEl('canvasNodes');
    if (!nodesContainer) return;

    this.canvasState.nodes.forEach(node => {
      let nodeEl = this._nodeElMap.get(node.id);
      const isNew = !nodeEl;

      if (isNew) {
        nodeEl = document.createElement('div');
        nodeEl.dataset.nodeId = node.id;
        nodeEl.innerHTML =
          '<div class="node-close">&times;</div>' +
          '<div class="node-header"></div>' +
          '<div class="node-body">' +
            '<span class="node-val"></span>' +
            '<span class="node-clear">&times;</span>' +
          '</div>' +
          '<div class="socket in" data-dir="in"><div class="socket-inner"></div></div>' +
          '<div class="socket out" data-dir="out"><div class="socket-inner"></div></div>';

        nodeEl._hdr = nodeEl.querySelector('.node-header');
        nodeEl._body = nodeEl.querySelector('.node-body');
        nodeEl._val = nodeEl.querySelector('.node-val');
        nodeEl._clear = nodeEl.querySelector('.node-clear');
        nodeEl._sckIn = nodeEl.querySelector('.socket.in');
        nodeEl._sckOut = nodeEl.querySelector('.socket.out');
        nodeEl._sckInIn = nodeEl.querySelector('.socket.in .socket-inner');
        nodeEl._sckOutIn = nodeEl.querySelector('.socket.out .socket-inner');
        nodeEl._close = nodeEl.querySelector('.node-close');

        this._bindNodeEvents(nodeEl, node.id);
        this._nodeElMap.set(node.id, nodeEl);
        nodesContainer.appendChild(nodeEl);
      }

      this._updateNodeAppearance(nodeEl, node);
    });
  },

  _bindNodeEvents(nodeEl, nodeId) {
    nodeEl._close.onmousedown = e => { e.stopPropagation(); };
    nodeEl._close.onclick = e => { e.stopPropagation(); if (this.readOnly) return; this.removeNode(nodeId); };
    nodeEl._clear.onmousedown = e => {
      e.stopPropagation();
      e.preventDefault();
      if (this.readOnly) return;
      const cn = this.canvasState.nodes.find(nn => nn.id === nodeId);
      if (cn) { cn.desc = ''; this.saveCanvasSnapshot(); this.renderCanvas(); }
    };
    nodeEl._sckIn.onmousedown = e => {
      if (e.button === 1) return;
      e.stopPropagation();
      if (this.readOnly) return;
      const cn = this.canvasState.nodes.find(nn => nn.id === nodeId);
      if (!cn) return;
      const rc = this._resolveColor(cn.color);
      this.startSocketDrag(e, nodeId, 'in', rc.isPreset ? rc.cls : rc.hex);
    };
    nodeEl._sckOut.onmousedown = e => {
      if (e.button === 1) return;
      e.stopPropagation();
      if (this.readOnly) return;
      const cn = this.canvasState.nodes.find(nn => nn.id === nodeId);
      if (!cn) return;
      const rc = this._resolveColor(cn.color);
      this.startSocketDrag(e, nodeId, 'out', rc.isPreset ? rc.cls : rc.hex);
    };
  },

  _updateNodeAppearance(nodeEl, node) {
    nodeEl.className = 'node' + (this.selectedNodeIds.has(node.id) ? ' selected' : '') + (this.dragState && this.dragState.nodeId === node.id ? ' dragging' : '');

    const rc = this._resolveColor(node.color);
    const isPreset = rc.isPreset;

    nodeEl._hdr.className = 'node-header' + (isPreset ? ' h-' + rc.cls : '');
    nodeEl._hdr.style.background = isPreset ? '' : 'linear-gradient(135deg,' + rc.hex + ',' + rc.shadeHex + ')';
    nodeEl._hdr.style.textShadow = isPreset ? '' : '0 1px 3px rgba(0,0,0,.35)';
    nodeEl._hdr.textContent = node.label || '未命名';

    nodeEl._val.innerHTML = node.desc
      ? this.escapeHtml(node.desc)
      : '<span class="node-empty">双击编辑</span>';

    const sckCls = 'socket ' + (isPreset ? 's-' + rc.cls + ' ' : '');
    nodeEl._sckIn.className = sckCls + 'in';
    nodeEl._sckOut.className = sckCls + 'out';
    const bdr = isPreset ? '' : rc.hex;
    nodeEl._sckIn.style.borderColor = bdr;
    nodeEl._sckOut.style.borderColor = bdr;
    nodeEl._sckInIn.style.background = bdr;
    nodeEl._sckOutIn.style.background = bdr;
    nodeEl._sckIn.dataset.node = node.id;
    nodeEl._sckOut.dataset.node = node.id;
    if (node.mirrored) {
      nodeEl._sckIn.style.left = 'auto';   nodeEl._sckIn.style.right = '-8px';
      nodeEl._sckOut.style.left = '-8px';  nodeEl._sckOut.style.right = 'auto';
    } else {
      nodeEl._sckIn.style.left = '';  nodeEl._sckIn.style.right = '';
      nodeEl._sckOut.style.left = ''; nodeEl._sckOut.style.right = '';
    }
  },

  _initGlobalEvents() {
    const nodesContainer = this._getEl('canvasNodes');
    const container = this._getEl('canvasStage');
    if (!nodesContainer || !container) return;

    if (!nodesContainer.dataset.ctxBound) {
      nodesContainer.dataset.ctxBound = '1';
      nodesContainer.addEventListener('contextmenu', function(e) {
        const nodeEl = e.target.closest('.node');
        if (!nodeEl) return;
        e.preventDefault(); e.stopPropagation();
        const isHeader = !!e.target.closest('.node-header');
        App.showCtx(e.clientX, e.clientY, nodeEl.dataset.nodeId, null, isHeader ? 'title' : 'desc');
      });
    }

    if (!nodesContainer.dataset.tipBound) {
      nodesContainer.dataset.tipBound = '1';
      let _tipTimer;
      const _tip = document.getElementById('nodeTip');
      nodesContainer.addEventListener('mouseover', function(e) {
        const val = e.target.closest('.node-val');
        if (!val) return;
        const body = val.closest('.node-body');
        if (!body || !body.classList.contains('has-overflow') || val.isContentEditable) return;
        const text = val.textContent || '';
        if (!text || text === '\u53CC\u51FB\u7F16\u8F91') return;
        clearTimeout(_tipTimer);
        _tipTimer = setTimeout(() => {
          const displayText = text;
          _tip.textContent = displayText;
          const nodeEl = val.closest('.node');
          const rect = nodeEl ? nodeEl.getBoundingClientRect() : null;
          if (rect) {
            let tl = rect.left + rect.width / 2 - 140, tt = rect.bottom + 8;
            if (tl < 4) tl = 4;
            if (tl + 280 > innerWidth - 4) tl = innerWidth - 284;
            if (tt + 200 > innerHeight) tt = rect.top - 200 - 8;
            if (tt < 4) tt = 4;
            _tip.style.cssText = 'display:block;left:' + tl + 'px;top:' + tt + 'px';
          } else {
            _tip.style.cssText = 'display:block;left:' + (e.clientX + 14) + 'px;top:' + (e.clientY + 14) + 'px';
          }
          _tip.dataset.mode = 'node';
        }, 300);
      }, true);
      nodesContainer.addEventListener('mouseout', (e) => {
        const val = e.target.closest('.node-val');
        if (!val) return;
        const rel = e.relatedTarget;
        if (rel && val.contains(rel)) return;
        clearTimeout(_tipTimer);
        _tip.style.display = 'none';
        delete _tip.dataset.mode;
      }, true);
      nodesContainer.addEventListener('mousemove', (e) => {
        if (_tip.style.display === 'block' && _tip.dataset.mode !== 'node') {
          let l2 = e.clientX + 14, t3 = e.clientY + 14;
          if (l2 + 290 > innerWidth) l2 = innerWidth - 290;
          if (t3 + 210 > innerHeight) t3 = innerHeight - 210;
          _tip.style.left = l2 + 'px';
          _tip.style.top = t3 + 'px';
        }
      }, true);
    }

    if (!nodesContainer.dataset.dragBound) {
      nodesContainer.dataset.dragBound = '1';
      App._dblClickTarget = null;
      nodesContainer.addEventListener('mousedown', function(e) {
        if (e.button === 1) return;
        const nodeEl = e.target.closest('.node');
        if (!nodeEl) return;
        const nodeId = nodeEl.dataset.nodeId;
        if (e.ctrlKey || e.metaKey) { e.stopPropagation(); }
        const isTextArea = (e.target.closest('.node-header') ||
          (e.target.closest('.node-body') && !e.target.closest('.node-clear')) ||
          (e.target.closest('.node-val') && !e.target.closest('.node-clear')));
        if (isTextArea) {
          const prev = App._dblClickTarget;
          if (prev && prev.nodeId === nodeId &&
              Math.abs(e.clientX - prev.x) < 8 && Math.abs(e.clientY - prev.y) < 8) {
            e.preventDefault(); e.stopPropagation();
            clearTimeout(prev.timerId);
            App._dblClickTarget = null;
            if (e.target.closest('.node-header')) { App.inlineEdit('nodeTitle', nodeId); }
            else { App.inlineEdit('nodeDesc', nodeId); }
            return;
          }
          if (prev) clearTimeout(prev.timerId);
          var timerId = setTimeout(function() { App._dblClickTarget = null; }, 250);
          App._dblClickTarget = { nodeId: nodeId, x: e.clientX, y: e.clientY, timerId: timerId };
        }
        App.startNodeDrag(e, nodeId);
      });
    }

    container.onmousedown = (e) => this.onCanvasMouseDown(e);
    container.onwheel = (e) => this.onCanvasWheel(e);
    container.onclick = (e) => this._onCanvasClick(e);
    container.ondblclick = (e) => this._onCanvasDblClick(e);
    container.oncontextmenu = () => false;

    if (!container.dataset.dropBound) {
      container.dataset.dropBound = '1';
      function isJsonDrag(e) {
        const items = e.dataTransfer.items;
        if (!items || !items[0]) return false;
        const t = String(items[0].type).toLowerCase();
        return Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1 && (t.indexOf('json') !== -1 || t.indexOf('+json') !== -1);
      }
      container.addEventListener('dragenter', (e) => {
        if (!isJsonDrag(e)) return;
        e.preventDefault(); container.classList.add('drag-over');
      });
      container.addEventListener('dragover', (e) => {
        if (!isJsonDrag(e)) return;
        e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
      });
      container.addEventListener('dragleave', (e) => {
        if (!container.contains(e.relatedTarget)) container.classList.remove('drag-over');
      });
      container.addEventListener('drop', (e) => {
        e.preventDefault(); container.classList.remove('drag-over');
        const files = e.dataTransfer.files;
        if (!files || files.length === 0) return;
        const f = files[0];
        if (!f.name.toLowerCase().endsWith('.json')) { this.showToast('请拖入 .json 文件', 'warning'); return; }
        const r = new FileReader();
        r.onload = () => {
          try { const d = JSON.parse(r.result); this._loadFromData(d); }
          catch (err) { this.showToast('解析失败: ' + err.message, 'error'); }
        };
        r.readAsText(f);
      });
      if (!window._dragendBound) {
        window._dragendBound = '1';
        document.addEventListener('dragend', function() { container.classList.remove('drag-over'); });
      }
    }
  },

  _postRenderUpdate() {
    this.updateNodePositions();
    this.applyViewTransform();
    this._buildSpatialIndex();
  },

  _finalizeRender() {
    requestAnimationFrame(() => {
      this._nodeElMap.forEach(el => {
        const val = el.querySelector('.node-val');
        const body = val ? val.closest('.node-body') : null;
        if (!body || !val) return;
        body.classList.toggle('has-overflow', val.scrollHeight > val.clientHeight + 1 && !val.isContentEditable);
      });
    });

    this._initCoordEditable();
    this.updateCoordDisplay();

    if (this._zOrderDirty && this._nodeZOrder) {
      const nodesContainer = this._getEl('canvasNodes');
      for (let zoi = 0; zoi < this._nodeZOrder.length; zoi++) {
        const zel = this._nodeElMap.get(this._nodeZOrder[zoi]);
        if (zel) nodesContainer.appendChild(zel);
      }
      this._zOrderDirty = false;
    }
    if (this._descEditNodeId) this._closeDescEdit();
    this._updateStatusBadge();
  },

  renderCanvas({ center = false } = {}) {
    if (!this._prepCanvas()) return;
    this._ensureCanvasSkeleton();
    this._renderNodes();
    this._initGlobalEvents();
    this._postRenderUpdate();
    this._finalizeRender();
    if (center) this.centerCanvasOnNodes();
  },

  // ── Socket anchor helper ──
  _getSocketAnchor(node, side) {
    return {
      x: (node.x || 0) + (side === 'out' ? (node.mirrored ? 0 : NODE_W) : (node.mirrored ? NODE_W : 0)),
      y: (node.y || 0) + SOCKET_Y
    };
  },

  // ── Shared geometry (screen + export use the same control point logic) ──
  _getConnControlPoints(fromX, fromY, toX, toY, cp1, cp2, mirrored1, mirrored2) {
    const defaultDx = Math.abs(toX - fromX) * 0.5;
    const autoC1x = mirrored1 ? -defaultDx : defaultDx;
    const autoC1y = 0;
    const autoC2x = mirrored2 ? defaultDx : -defaultDx;
    const autoC2y = 0;
    const c1x = cp1 ? autoC1x + cp1.dx : autoC1x;
    const c1y = cp1 ? autoC1y + cp1.dy : autoC1y;
    const c2x = cp2 ? autoC2x + cp2.dx : autoC2x;
    const c2y = cp2 ? autoC2y + cp2.dy : autoC2y;
    return { c1x, c1y, c2x, c2y };
  },
  _buildConnPath(fromX, fromY, toX, toY, cp1, cp2, mirrored1, mirrored2, scale) {
    const s = scale || 1;
    const c = this._getConnControlPoints(fromX, fromY, toX, toY, cp1, cp2, mirrored1, mirrored2);
    const x1 = fromX * s, y1 = fromY * s, x2 = toX * s, y2 = toY * s;
    return 'M' + x1 + ',' + y1 +
           ' C' + (x1 + c.c1x * s) + ',' + (y1 + c.c1y * s) +
           ' ' + (x2 + c.c2x * s) + ',' + (y2 + c.c2y * s) +
           ' ' + x2 + ',' + y2;
  },

  // ── Render Lines ──
  renderLines(filterNodeIds) {
    this._renderFilter = filterNodeIds || null;
    if (this._linesRaf) return;
    this._linesRaf = requestAnimationFrame(() => { this._linesRaf = null; this._doRenderLines(); });
  },

  // Clear connection selection and refresh line rendering. Returns true
  // if a selection was actually cleared (so callers can short-circuit).
  // Centralizes the 4 scattered "if (selectedConnKey) { null; renderLines(); }"
  // patterns that would otherwise live in canvas/node click / drag / delete.
  _clearConnSelection() {
    if (!this.selectedConnKey) return false;
    this.selectedConnKey = null;
    this.renderLines();
    return true;
  },

  // Wire up all interaction handlers for a connection's path or label.
  // Called ONLY at element creation. Uses dataset to find the paired
  // element at event time (not at bind time), so order of creation
  // (path before label or vice versa) doesn't matter, and we never
  // hold stale references across re-renders.
  _bindConnEl(el, k) {
    el.addEventListener('mousedown', e => { if (e.button !== 1) e.stopPropagation(); });
    el.addEventListener('click', e => {
      e.stopPropagation();
      this.selectedConnKey = k;
      this.selectedNodeIds.clear();
      this.renderLines();
      this._nodeElMap.forEach(n => { n.classList.remove('selected'); });
    });
    el.addEventListener('dblclick', e => { e.stopPropagation(); this.inlineEdit('edge', k); });
    el.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); this.showCtx(e.clientX, e.clientY, null, k); });
    // Hover → mirror .hover onto the paired element (path ↔ label).
    // Look up the sibling by dataset key at event time. Both path
    // (data-conn-key) and label (data-ck) share the same key value.
    el.addEventListener('mouseenter', () => {
      el.classList.add('hover');
      el.closest('svg').querySelectorAll('[data-conn-key="' + k + '"], [data-ck="' + k + '"]').forEach(elem => {
        elem.classList.add('hover');
      });
    });
    el.addEventListener('mouseleave', () => {
      el.classList.remove('hover');
      el.closest('svg').querySelectorAll('[data-conn-key="' + k + '"], [data-ck="' + k + '"]').forEach(elem => {
        elem.classList.remove('hover');
      });
    });
  },

  _doRenderLines() {
    const svg = document.getElementById('linesSvg');
    if (!svg) return;
    if (!svg.getAttribute('width')) {
      svg.setAttribute('width', '1');
      svg.setAttribute('height', '1');
    }
    /* Propagate scale as CSS variable so stroke-width stays proportional */
    svg.style.setProperty('--line-scale', this.scale);
    const curveOverlay = document.getElementById('curveOverlay');
    if (curveOverlay) curveOverlay.style.setProperty('--line-scale', this.scale);

    // ── Data-driven line rendering ──
    // All line geometry is computed HERE from the current data + scale.
    // No intermediate state (no cached `d` strings, no pre-scaled coords
    // stored on socketDragState). Every render call reads the live data
    // and produces correct geometry at the current zoom. This is what
    // makes zoom-during-socket-drag work: the temp line's endpoint is
    // stored as a WORLD coord (scale-invariant), so zoom just triggers
    // a re-render that multiplies by the new scale.
    //
    // Coordinate system:
    //   - node.x / node.y        : world coords (data)
    //   - socketDragState.toX/Y  : world coords (data)
    //   - SVG path `d` coords    : world * scale  (pan is handled by
    //                            .canvas-world's translate transform)
    const s = this.scale;

    // Viewport bounds in world coords for culling off-screen connections
    const vpL = -this.panX / s, vpT = -this.panY / s;
    const vpR = vpL + (this._cachedCW || 800) / s;
    const vpB = vpT + (this._cachedCH || 600) / s;
    const margin = 100;

    const connKey = c => c.from + '|' + c.to;
    let connGroup = svg.querySelector('.conn-group:not(.temp)');
    if (!connGroup) {
      connGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      connGroup.setAttribute('class', 'conn-group');
      svg.appendChild(connGroup);
    }
    // Two child layers guarantee z-order: paths first, labels second. SVG
    // paints later-appended elements on top, so labels always overlay the
    // lines — this is what makes "label on the line midpoint" readable.
    let linesGroup = connGroup.querySelector('.lines');
    if (!linesGroup) {
      linesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      linesGroup.setAttribute('class', 'lines');
      connGroup.appendChild(linesGroup);
    }
    let labelsGroup = connGroup.querySelector('.labels');
    if (!labelsGroup) {
      labelsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      labelsGroup.setAttribute('class', 'labels');
      connGroup.appendChild(labelsGroup);
    }

    if (!this._visPathByKey) { this._visPathByKey = new Map(); this._hitPathByKey = new Map(); this._labelByKey = new Map(); }

    /* Set once on <g> — SVG child elements inherit via CSS */
    linesGroup.style.strokeWidth = Math.max(15 * s, 8);
    labelsGroup.style.fontSize = 10 * s + 'px';

    const nodeMap = new Map();
    this.canvasState.nodes.forEach(n => nodeMap.set(n.id, n));

    const filter = this._renderFilter;
    this._renderFilter = null;

    // Orphan tracking: connections still in persistent maps after the loop
    // but NOT in this Set have been removed from data or culled.
    const seen = new Set();

    this.canvasState.connections.forEach(conn => {
      const k = connKey(conn);
      if (filter && !filter.has(conn.from) && !filter.has(conn.to)) return;
      const fromNode = nodeMap.get(conn.from);
      const toNode = nodeMap.get(conn.to);
      if (!fromNode || !toNode) return;
      const fromOut = this._getSocketAnchor(fromNode, 'out');
      const toIn = this._getSocketAnchor(toNode, 'in');
      // Skip if the Bezier curve's bounding box is completely outside viewport + margin.
      // Checks all 4 control points (start, cp1, cp2, end) instead of just endpoints.
      const cp = this._getConnControlPoints(fromOut.x, fromOut.y, toIn.x, toIn.y, conn.cp1, conn.cp2, !!fromNode.mirrored, !!toNode.mirrored);
      const bbL = Math.min(fromOut.x, fromOut.x + cp.c1x, toIn.x + cp.c2x, toIn.x);
      const bbR = Math.max(fromOut.x, fromOut.x + cp.c1x, toIn.x + cp.c2x, toIn.x);
      const bbT = Math.min(fromOut.y, fromOut.y + cp.c1y, toIn.y + cp.c2y, toIn.y);
      const bbB = Math.max(fromOut.y, fromOut.y + cp.c1y, toIn.y + cp.c2y, toIn.y);
      if (bbR < vpL - margin || bbL > vpR + margin || bbB < vpT - margin || bbT > vpB + margin) return;
      this._renderConnection(conn, k, fromNode, toNode, this.selectedConnKey === k, s, linesGroup, labelsGroup);
      seen.add(k);
    });

    // Drop orphan elements — only during full renders (filtered renders skip this)
    if (!filter) {
      for (const [k, p] of this._visPathByKey) { if (!seen.has(k)) { p.remove(); this._visPathByKey.delete(k); } }
      for (const [k, p] of this._hitPathByKey) { if (!seen.has(k)) { p.remove(); this._hitPathByKey.delete(k); } }
      for (const [k, p] of this._labelByKey) { if (!seen.has(k)) { p.remove(); this._labelByKey.delete(k); } }
    }

    this._renderTempLine(svg);
    this._renderCurveHandles();

    if (!filter) {
      this._buildSpatialIndex();

      // Sync node display and visible-cells tracking after full render
      const visCells = this._getActiveCells({ l: vpL - this._cellSize, t: vpT - this._cellSize, r: vpR + this._cellSize, b: vpB + this._cellSize });
      if (this._nodeCells) {
        this._updateNodeVisibility(visCells);
        this._lastVisibleCells = visCells;
      }
    }
  },

  // Render only the temp drag-connection line, skipping all permanent paths.
  // Called from socket drag onMove (hot path) to avoid rebuilding 62k paths.
  _renderTempLine(svg) {
    const existingTemp = svg.querySelector('.conn-group.temp');
    if (existingTemp) existingTemp.remove();
    if (!this.socketDragState) return;
    const sd = this.socketDragState;
    const startAnchor = this._getSocketAnchor(sd.node, sd.dir);
    const d = this._buildConnPath(startAnchor.x, startAnchor.y, sd.toWorldX, sd.toWorldY, null, null, (sd.dir === 'in') !== !!sd.node.mirrored, sd.dir === 'in', this.scale);
    const tempGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    tempGroup.setAttribute('class', 'conn-group temp');
    const tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    tempLine.setAttribute('d', d);
    const isPreset = COLORS.includes(sd.colorClass) || LEGACY_COLOR_MAP[sd.colorClass];
    tempLine.setAttribute('class', 'line temp' + (isPreset ? ' s-' + sd.colorClass : ''));
    tempLine.style.pointerEvents = 'none';
    if (!isPreset) tempLine.setAttribute('style', 'stroke:' + sd.colorClass);
    tempGroup.appendChild(tempLine);
    svg.appendChild(tempGroup);
  },

  // Render a single connection (create or update). Used by both full-scan
  // _doRenderLines and incremental pan updates. Updates persistent maps
  // (_visPathByKey / _hitPathByKey / _labelByKey) for any new elements.
  _renderConnection(conn, k, fromNode, toNode, isSelected, s, linesGroup, labelsGroup) {
    const fromOut = this._getSocketAnchor(fromNode, 'out');
    const toIn = this._getSocketAnchor(toNode, 'in');
    const d = this._buildConnPath(fromOut.x, fromOut.y,
                                  toIn.x,   toIn.y,
                                  conn.cp1, conn.cp2,
                                  !!fromNode.mirrored, !!toNode.mirrored, s);
    const fromRC = this._resolveColor(fromNode.color);
    const pathCls = 'line' + (fromRC.isPreset ? ' s-' + fromRC.cls : '') + (isSelected ? ' selected' : '');
    const pathStyle = fromRC.isPreset ? '' : 'stroke:' + fromRC.hex;

    // Dual-path architecture:
    // - visual path (line): thin line 2.5×scale, pointer-events=none, visual only
    // - hit path (hit-path): transparent thick line Math.max(15×scale, 8px), pointer-events=stroke, handles interaction
    //   Thickness inherited from parent <g>'s strokeWidth
    let path = this._visPathByKey.get(k);
    if (path) {
      path.setAttribute('d', d);
      path.setAttribute('class', pathCls);
      if (pathStyle) path.setAttribute('style', pathStyle); else path.removeAttribute('style');
    } else {
      path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.dataset.connKey = k;
      path.setAttribute('d', d);
      path.setAttribute('class', pathCls);
      if (pathStyle) path.setAttribute('style', pathStyle);
      linesGroup.appendChild(path);
      this._visPathByKey.set(k, path);
    }
    path.style.pointerEvents = 'none';

    // Hit path
    let hitPath = this._hitPathByKey.get(k);
    if (hitPath) {
      hitPath.setAttribute('d', d);
    } else {
      hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hitPath.dataset.connKey = k;
      hitPath.setAttribute('d', d);
