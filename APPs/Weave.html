      hitPath.setAttribute('class', 'hit-path');
      hitPath.setAttribute('fill', 'none');
      hitPath.setAttribute('stroke', 'transparent');
      hitPath.setAttribute('pointer-events', 'stroke');
      hitPath.setAttribute('opacity', '0');
      hitPath.style.cursor = 'pointer';
      linesGroup.insertBefore(hitPath, path);
      this._bindConnEl(hitPath, k);
      this._hitPathByKey.set(k, hitPath);
    }

    // Label at the actual cubic Bezier midpoint (t=0.5), follows curve control points
    const cp_lbl = this._getConnControlPoints(fromOut.x, fromOut.y, toIn.x, toIn.y, conn.cp1, conn.cp2, !!fromNode.mirrored, !!toNode.mirrored);
    const midX = ((fromOut.x + toIn.x) / 2 + 0.375 * (cp_lbl.c1x + cp_lbl.c2x)) * s;
    const midY = ((fromOut.y + toIn.y) / 2 + 0.375 * (cp_lbl.c1y + cp_lbl.c2y)) * s;
    let lbl = this._labelByKey.get(k);
    if (conn.label) {
      if (!lbl) {
        lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        lbl.dataset.ck = k;
        lbl.setAttribute('text-anchor', 'middle');
        lbl.setAttribute('font-style', 'italic');
        lbl.setAttribute('dominant-baseline', 'middle');
        lbl.setAttribute('class', 'line-label');
        lbl.setAttribute('fill', '#4a5568');
        labelsGroup.appendChild(lbl);
        this._bindConnEl(lbl, k);
        this._labelByKey.set(k, lbl);
      }
      lbl.setAttribute('x', midX);
      lbl.setAttribute('y', midY);
      lbl.textContent = conn.label;
      lbl.classList.toggle('selected', isSelected);
    } else if (lbl) {
      lbl.remove();
      this._labelByKey.delete(k);
    }
  },

  _removeConnection(k) {
    const p = this._visPathByKey.get(k);
    if (p) { p.remove(); this._visPathByKey.delete(k); }
    const h = this._hitPathByKey.get(k);
    if (h) { h.remove(); this._hitPathByKey.delete(k); }
    const l = this._labelByKey.get(k);
    if (l) { l.remove(); this._labelByKey.delete(k); }
  },

  // ── Spatial grid index for incremental pan rendering ──

  // Spatial grid index for incremental pan rendering
  // cellSize = 500 (world coords)
  // _nodeCells:    cellKey "cx,cy" → Set<nodeId>
  // _nodeCellMap:  nodeId → cellKey (reverse lookup)
  // _connByNode:   nodeId → Set<connKey>
  // _connKeyMap:   connKey → connection object
  _buildSpatialIndex() {
    const cs = this._cellSize;
    this._nodeCells = new Map();
    this._nodeCellMap = new Map();
    this._connByNode = new Map();
    this._connKeyMap = new Map();
    for (const node of this.canvasState.nodes) {
      const cx = isNaN(node.x) ? 0 : Math.floor(node.x / cs);
      const cy = isNaN(node.y) ? 0 : Math.floor(node.y / cs);
      const ck = cx + ',' + cy;
      if (!this._nodeCells.has(ck)) this._nodeCells.set(ck, new Set());
      this._nodeCells.get(ck).add(node.id);
      this._nodeCellMap.set(node.id, ck);
      this._connByNode.set(node.id, new Set());
    }
    for (const conn of this.canvasState.connections) {
      const k = conn.from + '|' + conn.to;
      this._connKeyMap.set(k, conn);
      const fs = this._connByNode.get(conn.from);
      if (fs) fs.add(k);
      const ts = this._connByNode.get(conn.to);
      if (ts) ts.add(k);
    }
    this._lastVisibleCells = null;
  },

  // Find registered grid cells that intersect the given world-coord rect
  _getActiveCells(rect) {
    if (!this._nodeCells) return new Set();
    const cs = this._cellSize;
    const cL = Math.floor(rect.l / cs);
    const cR = Math.floor(rect.r / cs);
    const cT = Math.floor(rect.t / cs);
    const cB = Math.floor(rect.b / cs);
    const result = new Set();
    for (let r = cT; r <= cB; r++) {
      for (let col = cL; col <= cR; col++) {
        const ck = col + ',' + r;
        if (this._nodeCells.has(ck)) result.add(ck);
      }
    }
    return result;
  },

  // Collect all connection keys that involve nodes in the given cells
  _getCellConnections(cells) {
    const conns = new Set();
    for (const cell of cells) {
      const nodeIds = this._nodeCells.get(cell);
      if (!nodeIds) continue;
      for (const nodeId of nodeIds) {
        const nodeConns = this._connByNode.get(nodeId);
        if (nodeConns) {
          for (const ck of nodeConns) conns.add(ck);
        }
      }
    }
    return conns;
  },

  // Node display:none hides only the node DOM; connections are managed independently by SVG
  _updateNodeVisibility(visibleCells) {
    for (const node of this.canvasState.nodes) {
      const cell = this._nodeCellMap.get(node.id);
      const vis = cell && visibleCells.has(cell);
      const el = this._nodeElMap.get(node.id);
      if (el) el.style.display = vis ? '' : 'none';
    }
  },

  // Incremental pan update: single-range approach.
  // - visibleCells = viewport ± cellSize → connections for their nodes are rendered.
  // - Off-screen nodes get display:none; gone cells' connections are cleaned up.
  // Called from the pan rAF handler.
  // Selection state is read live from App.selectedConnKey (not hardcoded),
  // so culled connections keep their highlight when they re-enter the viewport.
  _panUpdateConnections() {
    if (!this._nodeCells) return;

    const s = this.scale;
    const cw = this._cachedCW || 800;
    const ch = this._cachedCH || 600;
    const vpL = -this.panX / s, vpT = -this.panY / s;
    const vpR = vpL + cw / s, vpB = vpT + ch / s;
    const margin = this._cellSize;

    // Visible range = viewport + cellSize (avoids flicker at cell boundaries)
    const visibleCells = this._getActiveCells({ l: vpL - margin, t: vpT - margin, r: vpR + margin, b: vpB + margin });

    if (!this._lastVisibleCells) this._lastVisibleCells = new Set();

    // Node culling
    this._updateNodeVisibility(visibleCells);

    // Cleanup: connections whose BOTH endpoint cells left the visible range
    const goneCells = new Set();
    for (const c of this._lastVisibleCells) { if (!visibleCells.has(c)) goneCells.add(c); }
    if (goneCells.size > 0) {
      for (const k of this._getCellConnections(goneCells)) {
        const conn = this._connKeyMap.get(k);
        if (!conn) continue;
        const fc = this._nodeCellMap.get(conn.from);
        const tc = this._nodeCellMap.get(conn.to);
        if ((!fc || !visibleCells.has(fc)) && (!tc || !visibleCells.has(tc))) {
          this._removeConnection(k);
        }
      }
    }

    // Render: ensure visible cells' connections exist in DOM
    const svg = document.getElementById('linesSvg');
    if (svg) {
      // Fallback: create the SVG layer stack if _doRenderLines has not yet
      // populated it. _doRenderLines normally owns creation (see line ~1534),
      // but this function can run before any full render — e.g. during the
      // very first init, or on a path/race that bypasses the _linesRaf
      // guard at the pan-mousemove call site. Without this, connections
      // entering the viewport would be silently skipped and stay invisible
      // until the next full render. Mirrors the structure in _doRenderLines.
      let connGroup = svg.querySelector('.conn-group:not(.temp)');
      if (!connGroup) {
        connGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        connGroup.setAttribute('class', 'conn-group');
        svg.appendChild(connGroup);
      }
      let linesGroup = connGroup.querySelector('.lines');
      if (!linesGroup) {
        linesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        linesGroup.setAttribute('class', 'lines');
        connGroup.appendChild(linesGroup);
      }
      let labelsGroup = connGroup.querySelector('.labels');
      if (!labelsGroup) {
        labelsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        labelsGroup.setAttribute('class', 'labels');
        connGroup.appendChild(labelsGroup);
      }
      // _renderConnection reads from these maps; they must be initialized
      // or it will throw on .get(). _doRenderLines normally initializes
      // them, but the fallback path here may run first.
      if (!this._visPathByKey) {
        this._visPathByKey = new Map();
        this._hitPathByKey = new Map();
        this._labelByKey = new Map();
      }
      // Set the inherited SVG attributes that _doRenderLines normally sets.
      // Without strokeWidth, the hit path's pointer-events=stroke target
      // is too thin to click. Without fontSize, labels render at the SVG
      // default. _doRenderLines will overwrite these on its next run, so
      // any temporary visual drift self-corrects.
      linesGroup.style.strokeWidth = Math.max(15 * s, 8);
      labelsGroup.style.fontSize = 10 * s + 'px';

      const connKeys = this._getCellConnections(visibleCells);
      if (connKeys.size > 0) {
        const nodeMap = new Map();
        this.canvasState.nodes.forEach(n => nodeMap.set(n.id, n));
        for (const k of connKeys) {
          if (this._visPathByKey.has(k)) continue;
          const conn = this._connKeyMap.get(k);
          if (!conn) continue;
          const fromNode = nodeMap.get(conn.from);
          const toNode = nodeMap.get(conn.to);
          if (!fromNode || !toNode) continue;
          // Pass live selection state so culled connections that re-enter
          // the viewport keep their highlight (App.selectedConnKey is the
          // source of truth). Hardcoding false here would silently drop
          // the .selected class + label halo on re-render.
          this._renderConnection(conn, k, fromNode, toNode, this.selectedConnKey === k, s, linesGroup, labelsGroup);
        }
      }
    }

    this._lastVisibleCells = visibleCells;
  },

  // ── Animations ──
  //
  // Frame-sequence snap animation with two independent refresh streams.
  //
  // Why not WAAPI / CSS transitions:
  //   An earlier implementation used el.animate() with fill:'forwards'. The
  //   animation visually overrode el.style.transform, but only wrote the final
  //   value back to el.style.transform inside its onfinish callback. If the
  //   user grabbed the node mid-animation, the WAAPI animation was cancelled,
  //   the visual snapped back to the (stale) pre-snap transform, while
  //   nodeObj.x/y already held the snapped target — producing a data/visual
  //   desync. The first mousemove then jumped the node to (snappedX+dx,
  //   snappedY+dy), manifesting as "flash back to the aligned grid" and a
  //   broken drag feel.
  //
  // Current design (frame sequence + two independent streams):
  //   1. On drag end, compute the nearest grid line for each node.
  //   2. Pre-compute a frame sequence — an explicit array of {x, y} positions
  //      sampled at 1ms granularity. This array is the "script" of the
  //      animation: every frame's target position is stored as data, not
  //      computed on the fly.
  //   3. Post-processing (overshoot, jitter, dance moves, etc.) is done by
  //      directly mutating this array. Adding an effect = editing the array.
  //   4. TWO INDEPENDENT STREAMS advance the animation:
  //
  //      DATA STREAM (setInterval @ 240Hz constant):
  //        - Frequency is a hardcoded constant (240Hz), independent of the
  //          browser's actual refresh rate. This is the key design decision:
  //          the animation's heartbeat is browser-independent.
  //        - Each tick: elapsed = performance.now() - startTime
  //                     idx = floor(elapsed / 1ms)
  //                     node.x/y = frames[idx]    (DATA ONLY, no DOM write)
  //                     animState.dirty = true
  //        - 240Hz covers all consumer displays (60/120/144/240Hz). On a
  //          60Hz browser, 3 out of every 4 data ticks are "wasted" (their
  //          values get overwritten before the next paint), but this is fine
  //          — the cost is just a few object property writes, and the
  //          guarantee is that node.x/y is always current when the browser
  //          does paint.
  //
  //      RENDER STREAM (requestAnimationFrame, vsync-bound):
  //        - Frequency = browser refresh rate (whatever it is).
  //        - Each tick: for each dirty anim, sync node.x/y → el.style.transform,
  //                     clear dirty, call renderLines() once (batched).
  //        - Does NOT advance the animation — that's the data stream's job.
  //        - If the browser drops a frame, this tick doesn't run, but the
  //          data stream keeps updating node.x/y. Next paint picks up the
  //          latest position. No animation slowdown.
  //
  //   5. Because the data stream uses time-based indexing (performance.now()),
  //      the animation ALWAYS takes 150ms regardless of the data stream
  //      frequency or the browser refresh rate.
  //   6. Interrupt handling: if the user grabs the node mid-animation, simply
  //      cancel (remove from active set, set cancelled flag). There is NO
  //      sync issue, because the data stream writes node.x/y on every tick
  //      and the render stream syncs it to DOM — node.x/y always equals the
  //      displayed position. The next drag starts from wherever the node was
  //      visually when grabbed.
  //   7. Both streams self-stop when _activeSnapAnims becomes empty. Idle =
  //      zero CPU. Background tabs: setInterval is throttled (browser-
  //      dependent, typically ~1Hz), so the data stream effectively pauses;
  //      RAF is also throttled. Both resume when the tab regains focus.
  //
  // Animation feel:
  //   150ms total: 100ms linear slide (start → target) + 50ms overshoot tail
  //   (target → 15% past target → target). The tail gives a subtle "bounce"
  //   feel without being exaggerated.
  //

  // Set of currently-active snap animations. Each entry is the animState
  // object also referenced by el._snapAnim. Using a Set (not an array) so
  // add/remove is O(1) and duplicates are impossible.
  _activeSnapAnims: new Set(),

  // ── Two independent refresh streams ──
  //
  // 1. DATA STREAM (setInterval, fixed 240Hz constant):
  //      Drives node.x/y updates. Frequency is a hardcoded constant (240Hz),
  //      independent of the browser's actual refresh rate. This guarantees
  //      the animation always advances at a smooth rate regardless of the
  //      display. 240Hz is chosen because it covers all consumer displays
  //      (60/120/144/240Hz) — even on a 240Hz screen, the data stream ticks
  //      at the same rate, so no frames are starved.
  //
  // 2. RENDER STREAM (requestAnimationFrame, vsync-bound):
  //      Syncs node.x/y → el.style.transform so the browser can paint it.
  //      Frequency = browser refresh rate (whatever it is). This stream
  //      doesn't decide WHEN the node moves — it only copies the latest
  //      data position to the DOM so the browser's next paint picks it up.
  //
  // Why split:
  //   - Data stream frequency is a constant → animation smoothness is
  //     browser-independent. A 30Hz throttled background tab still gets
  //     240 data updates per second (most are wasted, but the position
  //     is always current when the browser does paint).
  //   - Render stream follows vsync → no tearing, no wasted paints.
  //   - The two are decoupled: dropping the render stream (e.g. tab hidden)
  //     doesn't stop the data stream; the data stream can be cancelled
  //     without affecting the render stream's idle state.
  _snapDataInterval: null,
  _snapRenderRaf: null,

  // Data stream frequency (Hz). Constant — never queried, never measured.
  // Higher = smoother animation on high-refresh displays, more CPU.
  // 240Hz covers all consumer displays without excessive CPU.
  _snapDataHz: 240,

  // ═══════════════════════════════════════════════════════════════════
  // FRAME-SEQUENCE ANIMATION (data-driven, decoupled from rendering)
  //
  // Design:
  //   1. _animateNodeToGrid pre-computes a frame sequence (an array of
  //      {x, y} positions) ONCE when the animation starts. This sequence
  //      is the "script" of the animation — every frame's target position
  //      is explicitly stored.
  //
  //   2. Post-processing (overshoot, jitter, easing, dance moves, etc.)
  //      is done by directly mutating/appending to this array. Because
  //      positions are explicit data, any effect is just an array edit —
  //      no function-logic gymnastics required.
  //
  //   3. _snapSchedulerTick advances the frame pointer based on elapsed
  //      wall-clock time (performance.now()), NOT by counting RAF ticks.
  //      This means the animation duration is fixed regardless of the
  //      browser's actual RAF frequency. If the browser drops frames,
  //      we just skip ahead to the correct frame for the current time.
  //
  //   Known limitation: the data stream removes the animation from
  //   _activeSnapAnims as soon as it completes (_snapDataTick finish branch),
  //   but if the render stream hasn't executed yet, the final DOM write may
  //   be lost. Visual gap <1 frame, not yet fixed.
  //
  // Why frame sequence (not a time function):
  //   - Explicit storage = debuggable. `console.log(frames)` shows the
  //     entire trajectory.
  //   - Post-processing = array edits. Adding overshoot = append a few
  //     frames. Adding jitter = offset each element. Adding a dance move
  //     = splice in a circle arc. All trivial, composable, inspectable.
  //   - The "frame rate mismatch" concern is a non-issue: we use time to
  //     INDEX into the array, so the array length doesn't need to match
  //     the actual refresh rate. Browser drops frames → we skip ahead,
  //     no slowdown.
  // ═══════════════════════════════════════════════════════════════════

  _animateNodeToGrid(el, node, worldX, worldY) {
    // Cancel any in-flight snap animation on this element first.
    this._cancelSnapAnim(el);

    // Read the current visual position from el.style.transform (this is the
    // true source of truth — WAAPI is no longer involved, so the style always
    // reflects what the user sees).
    const currentTransform = el.style.transform;
    const match = currentTransform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
    const currentX = match ? parseFloat(match[1]) : worldX;
    const currentY = match ? parseFloat(match[2]) : worldY;

    // ── Data/visual sync at animation start ──
    // Callers (e.g. onUp) typically write node.x/y = snapTarget BEFORE
    // invoking this function, so at this moment we have a desync:
    //   node.x        = snapTarget (e.g. 100)
    //   el.style.transform = pre-snap visual position (e.g. 102)
    // If we let this desync persist, the next renderLines() tick (queued
    // by the caller right after this returns) computes line endpoints
    // from node.x = 100, jumping the connection line + label to the
    // snap target one frame early. Then the data stream's first tick
    // overwrites node.x = frames[0].x = 102, and the next renderLines()
    // jumps the line BACK to the start — manifesting as a single
    // "shake" on connection lines and labels while the node itself
    // stays still. Writing currentX/Y here makes data === visual at
    // animation start, so the data stream's first frame write is a
    // no-op and there is no visible discontinuity.
    if (node) { node.x = currentX; node.y = currentY; }  // overwrite caller's snappedX/Y, restore current visual position to avoid connection flicker

    // No distance to cover — pin to target and bail.
    if (Math.abs(worldX - currentX) < 0.01 && Math.abs(worldY - currentY) < 0.01) {
      el.style.transform = 'translate(' + worldX + 'px,' + worldY + 'px)';
      if (node) { node.x = worldX; node.y = worldY; }
      this.renderLines();
      return;  // already at target position, no animation needed, pin directly
    }

    // ── Animation timing (in milliseconds) ──
    //   base phase (0 → baseMs): linear slide from start to target.
    //   tail phase (baseMs → totalMs): overshoot — target → peak → target.
    //   total = 150ms. Time is used to INDEX into the frame array, so the
    //   actual playback duration is always 150ms regardless of RAF rate.
    const baseMs = 100;
    const tailMs = 50;
    const totalMs = baseMs + tailMs;

    // ── Build the frame sequence ──
    // We sample the trajectory at a fixed granularity (one frame per
    // millisecond-step). This gives plenty of resolution for any refresh
    // rate (60Hz needs ~9 samples for 150ms, 240Hz needs ~36; we generate
    // 150 samples, so there's always a sample near the needed time).
    //
    // Why 1ms granularity: it's fine-grained enough that the scheduler can
    // always find a frame close to "where we should be right now", and the
    // array is small (150 elements = ~2.4KB). Going finer (e.g. 0.5ms)
    // wastes memory; going coarser (e.g. 16ms) would lose smoothness on
    // high-refresh displays.
    const sampleStepMs = 1;
    const dx = worldX - currentX;
    const dy = worldY - currentY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const ux = dx / dist;
    const uy = dy / dist;
    // Overshoot peak = target + 15% of (start→target) direction.
    const overshootAmount = 0.15;
    const peakX = worldX + ux * dist * overshootAmount;
    const peakY = worldY + uy * dist * overshootAmount;
    const peakRatio = 0.5; // peak at middle of tail

    const frames = [];
    for (let tMs = 0; tMs <= totalMs; tMs += sampleStepMs) {
      let x, y;
      if (tMs < baseMs) {
        // Base phase: linear start → target.
        const t = tMs / baseMs;
        x = currentX + dx * t;
        y = currentY + dy * t;
      } else if (tMs < totalMs) {
        // Tail phase: target → peak → target.
        const tailT = (tMs - baseMs) / tailMs; // 0..1 within tail
        if (tailT <= peakRatio) {
          const t = tailT / peakRatio;
          x = worldX + (peakX - worldX) * t;
          y = worldY + (peakY - worldY) * t;
        } else {
          const t = (tailT - peakRatio) / (1 - peakRatio);
          x = peakX + (worldX - peakX) * t;
          y = peakY + (worldY - peakY) * t;
        }
      } else {
        // Final frame: exactly on target (avoids float drift).
        x = worldX;
        y = worldY;
      }
      frames.push({ x: x, y: y });
    }

    // ── Post-processing hook ──
    // This is where you'd mutate `frames` to add effects like jitter,
    // dance moves, pauses, etc. The base trajectory is already complete
    // and valid; any post-processing is optional and composable.
    //
    // Example (NOT enabled — uncomment to play):
    //
    //   // Add ±2px jitter to middle frames, tapering at both ends
    //   for (let i = 0; i < frames.length; i++) {
    //     const envelope = 1 - Math.abs(2 * i / frames.length - 1);
    //     frames[i].x += (Math.random() - 0.5) * 4 * envelope;
    //     frames[i].y += (Math.random() - 0.5) * 4 * envelope;
    //   }
    //
    //   // Append a little dance at the end (3 small bounces)
    //   for (let i = 0; i < 3; i++) {
    //     frames.push({ x: worldX, y: worldY - 4 * (1 - i/3) });
    //     frames.push({ x: worldX, y: worldY });
    //   }

    // ── Animation state ──
    // startTime is set lazily on the first data tick. The data tick uses
    // (performance.now() - startTime) to index into frames[], so playback
    // duration is always totalMs regardless of the data stream frequency.
    const animState = {
      frames: frames,            // explicit frame sequence (the "script")
      frameIndex: 0,             // current playback position
      startTime: null,           // set on first data tick
      totalMs: totalMs,          // total animation duration
      targetX: worldX,
      targetY: worldY,
      cancelled: false,
      node: node,
      el: el,
      dirty: false               // set true by data stream when node.x/y changes;
                                 // cleared by render stream after syncing to DOM
    };
    el._snapAnim = animState;

    // Register with the global scheduler. Start both streams if not already
    // running:
    //   - Data stream (setInterval @ 240Hz): advances frameIndex, updates
    //     node.x/y, marks animState.dirty = true.
    //   - Render stream (RAF): for each dirty anim, syncs node.x/y →
    //     el.style.transform, clears dirty.
    // Both streams self-stop when _activeSnapAnims becomes empty.
    this._activeSnapAnims.add(animState);
    if (this._snapDataInterval === null) {
      const intervalMs = 1000 / this._snapDataHz;
      this._snapDataInterval = setInterval(this._snapDataTick, intervalMs);
    }
    if (this._snapRenderRaf === null) {
      this._snapRenderRaf = requestAnimationFrame(this._snapRenderTick);
    }
  },

  // ═══════════════════════════════════════════════════════════════════
  // DATA STREAM TICK (setInterval, 240Hz constant)
  //
  // This is the animation's heartbeat. It runs at a FIXED frequency (240Hz),
  // independent of the browser's refresh rate. Each tick:
  //   1. For every active animation, compute the current frame index from
  //      real wall-clock time (performance.now() - startTime).
  //   2. Update node.x/y to the frame's position (DATA ONLY — no DOM write).
  //   3. Mark animState.dirty = true so the render stream knows to sync.
  //   4. If the animation is complete, pin to target and remove from active set.
  //
  // Why data-only (no DOM write here):
  //   - DOM writes are expensive (trigger style recalc / layout). Doing them
  //     at 240Hz would waste CPU on overlapping writes the browser can't
  //     paint anyway (60Hz browser = 4 data ticks per paint; only the last
  //     write matters).
  //   - The render stream (RAF) runs at the browser's actual paint rate and
  //     picks up the latest node.x/y. This way we get 240Hz smooth data with
  //     only ~60Hz DOM writes.
  // ═══════════════════════════════════════════════════════════════════
  // Index the frame sequence by wall-clock time (performance.now()) to guarantee 150ms animation duration
  _snapDataTick: function () {
    const self = window.App;
    if (self._activeSnapAnims.size === 0) {
      // No active animations — stop the data stream (idle = zero CPU).
      clearInterval(self._snapDataInterval);
      self._snapDataInterval = null;
      return;
    }

    const now = performance.now();
    const sampleStepMs = 1;

    // Snapshot the set — animState.cancelled may be flipped during the loop
    // (e.g. by startNodeDrag grabbing a node), and Set iteration during
    // mutation is fragile.
    const snapshot = Array.from(self._activeSnapAnims);
    for (const anim of snapshot) {
      if (anim.cancelled) {
        self._activeSnapAnims.delete(anim);
        continue;
      }

      // Lazy-init startTime on the first data tick.
      if (anim.startTime === null) {
        anim.startTime = now;
      }
      const elapsed = now - anim.startTime;
      const idx = Math.floor(elapsed / sampleStepMs);

      if (idx >= anim.frames.length) {
        // Animation complete — pin node.x/y to exact target. Mark dirty so
        // the render stream does the final DOM write.
        if (anim.node) {
          anim.node.x = anim.targetX;
          anim.node.y = anim.targetY;
        }
        anim.frameIndex = anim.frames.length;
        anim.dirty = true;
        anim.el._snapAnim = null;
        self._activeSnapAnims.delete(anim);
        continue;
      }

      // Update data position from the pre-computed frame.
      const f = anim.frames[idx];
      if (anim.node) {
        anim.node.x = f.x;
        anim.node.y = f.y;
      }
      anim.frameIndex = idx;
      anim.dirty = true;  // tell render stream to sync this to DOM
    }
  },

  // ═══════════════════════════════════════════════════════════════════
  // RENDER STREAM TICK (requestAnimationFrame, vsync-bound)
  //
  // This runs at the browser's actual refresh rate. It does NOT advance the
  // animation — that's the data stream's job. This tick only:
  //   1. For every active animation marked dirty, sync node.x/y →
  //      el.style.transform, then clear dirty.
  //   2. Call renderLines() once (batched) so connection lines follow.
  //
  // If the browser drops a frame, this tick simply doesn't run that frame —
  // but the data stream keeps updating node.x/y, so the next paint picks up
  // the latest position. No animation slowdown.
  // ═══════════════════════════════════════════════════════════════════
  _snapRenderTick: function () {
    const self = window.App;
    self._snapRenderRaf = null;

    let anyDirty = false;
    const snapshot = Array.from(self._activeSnapAnims);
    for (const anim of snapshot) {
      if (anim.cancelled) continue;
      if (!anim.dirty) continue;

      // Sync data → DOM. Read the current node.x/y (already updated by the
      // data stream) and write to el.style.transform.
      const el = anim.el;
      const x = anim.node ? anim.node.x : anim.targetX;
      const y = anim.node ? anim.node.y : anim.targetY;
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      anim.dirty = false;
      anyDirty = true;
    }

    // If any animation was dirty, refresh connection lines once.
    // (renderLines self-coalesces via _linesRaf, so this is cheap.)
    if (anyDirty || self._activeSnapAnims.size > 0) {
      self.renderLines();
    }

    // Keep the render stream running while there are active animations.
    // When all animations complete, the data stream stops itself (see
    // _snapDataTick), and we stop the render stream here.
    if (self._activeSnapAnims.size > 0) {
      self._snapRenderRaf = requestAnimationFrame(self._snapRenderTick);
    }
  },

  // Cancel any in-flight snap animation on the given element.
  // After this returns, el._snapAnim is null and the element's transform /
  // node.x/y are guaranteed to be in sync (because the animation wrote both
  // on every frame, so whatever values are currently set are mutually
  // consistent).
  _cancelSnapAnim(el) {
    if (!el._snapAnim) return;
    const anim = el._snapAnim;
    anim.cancelled = true;
    // Remove from the global scheduler — it will skip this anim on its next
    // tick (or never see it if we delete now). Deleting now is O(1) and keeps
    // the active set tidy.
    this._activeSnapAnims.delete(anim);
    el._snapAnim = null;
  },

  // ── Node Drag ──
  startNodeDrag(e, nodeId) {
    if (this.readOnly) return;
    // Close lingering tooltip — drag keeps the mouse over the node, so
    // mouseout never fires and the tooltip would stay pinned in place.
    const tip = document.getElementById('nodeTip');
    if (tip) { tip.style.display = 'none'; delete tip.dataset.mode; }
    e.preventDefault();
    e.stopPropagation();
    this.canvasPanState = null;
    this._dragActuallyMoved = false;

    /* Ctrl+click: toggle selection without clearing others */
    if (e.ctrlKey || e.metaKey) {
      if (this.selectedNodeIds.has(nodeId)) this.selectedNodeIds.delete(nodeId);
      else this.selectedNodeIds.add(nodeId);
      this.renderCanvas();
      return;
    }

    if (!this.selectedNodeIds.has(nodeId)) this.selectedNodeIds.clear();

    const nodeEl = this._nodeElMap.get(nodeId);
    if (!nodeEl) return;
    const node = this.canvasState.nodes.find(n => n.id === nodeId);
    if (!node) return;

    // Cancel any in-flight snap animations on ALL nodes (not just the one
    // being grabbed) so that, e.g., a multi-node snap that is still running
    // when the user grabs a different node also stops cleanly. Because the
    // animation keeps node.x/y in sync with el.style.transform on every
    // frame, cancellation here leaves every node in a consistent state —
    // node.x/y is exactly the visual position. The new drag then starts
    // from wherever the node was visually when grabbed. No flash-back.
    this._nodeElMap.forEach(el => {
      el.style.transition = 'none';
      this._cancelSnapAnim(el);
    });

    // Grabbing a node clears connection selection (consistent with _nodeClick).
    this._clearConnSelection();

    const wp = this.getWorldPos(e.clientX, e.clientY);

    const nodesToDrag = [];
    // Multi-select (>1 and clicked selected node): drag all selected nodes together
    // Single-select or clicked unselected node: drag only this node
    if (this.selectedNodeIds.size > 1 && this.selectedNodeIds.has(nodeId)) {
      this.selectedNodeIds.forEach(sid => {
        const sn = this.canvasState.nodes.find(nn => nn.id === sid);
        if (sn) nodesToDrag.push({ id: sid, origX: sn.x || 0, origY: sn.y || 0 });
      });
    } else {
      nodesToDrag.push({ id: nodeId, origX: node.x || 0, origY: node.y || 0 });
    }

    this.dragState = { nodeId, startWorldX: wp.x, startWorldY: wp.y, nodes: nodesToDrag };
    this.isDragging = true;
    nodeEl.classList.add('dragging');
    const self = this;
    let dragRafId = null;

    function onMove(e2) {
      if (!self.dragState) return;
      self._dragActuallyMoved = true;
      if (dragRafId) return;
      dragRafId = requestAnimationFrame(() => {
        dragRafId = null;
        const wp2 = self.getWorldPos(e2.clientX, e2.clientY);
        const dx = wp2.x - self.dragState.startWorldX;
        const dy = wp2.y - self.dragState.startWorldY;
        for (const n of self.dragState.nodes) {
          const nodeObj = self.canvasState.nodes.find(nn => nn.id === n.id);
          const newX = n.origX + dx, newY = n.origY + dy;
          if (nodeObj) { nodeObj.x = newX; nodeObj.y = newY; }
          const el = self._nodeElMap.get(n.id);
          if (el) el.style.transform = 'translate(' + newX + 'px,' + newY + 'px)';
        }
        self.renderLines(new Set(self.dragState.nodes.map(n => n.id)));
      });
    }

    function onUp() {
      let positionChanged = false;
      if (dragRafId) { cancelAnimationFrame(dragRafId); dragRafId = null; }
      if (self.dragState && self.dragState.nodes) {
        for (const n of self.dragState.nodes) {
          const nodeObj = self.canvasState.nodes.find(nn => nn.id === n.id);
          if (!nodeObj) continue;
          // Capture the CURRENT visual position BEFORE overwriting with the
          // snap target. The previous code compared snappedX to n.origX
          // (the position BEFORE drag), which meant dragging within a single
          // grid cell (e.g. 100→102, both snap to 100) would set
          // positionChanged = false and SKIP the animation entirely —
          // causing the node to teleport to the snap target with no visible
          // movement. This is the "near-teleport" bug.
          //
          // The correct comparison is: does the node need to MOVE from its
          // current visual position to reach the snap target? If yes
          // (even by 1px), the animation should run.
          const visualX = nodeObj.x;
          const visualY = nodeObj.y;
          const snappedX = Math.round(visualX / GRID) * GRID;
          const snappedY = Math.round(visualY / GRID) * GRID;
          // positionChanged = "the snap target differs from where the node
          // currently is". This is what determines whether an animation is
          // needed. Also gates saveCanvasSnapshot below — if the node is
          // already on the grid (no snap needed), no snapshot is warranted.
          if (snappedX !== visualX || snappedY !== visualY) positionChanged = true;
          nodeObj.x = snappedX;
          nodeObj.y = snappedY;
          const el = self._nodeElMap.get(n.id);
          if (el) {
            el.classList.remove('dragging');
            // Pass nodeObj so the animation can keep node.x/y in sync with
            // the visual position on every frame. This is what makes
            // mid-animation interruption safe.
            if (positionChanged) {
              self._animateNodeToGrid(el, nodeObj, snappedX, snappedY);
            } else {
              el.style.transform = 'translate(' + snappedX + 'px,' + snappedY + 'px)';
            }
          }
        }
      }
      // Update z-order: dragged nodes move to front. Re-append DOM children
      // IMMEDIATELY so the visual stack updates right now, not on the next
      // renderCanvas() call. Without this, a tiny drag (no
      // position change) updates _nodeZOrder but the DOM stack still shows
      // the dragged node UNDER other overlapping nodes — looking like the
      // click "did nothing". appendChild is cheap when order barely changes
      // (browser no-ops moves on already-appended children).
      if (self.dragState && self.dragState.nodes) {
        let zOrderChanged = false;
        for (const n of self.dragState.nodes) {
          const dIdx = self._nodeZOrder.indexOf(n.id);
          if (dIdx >= 0) self._nodeZOrder.splice(dIdx, 1);
          // Detect if the node's index actually changed. After splice +
          // push, the node sits at index (length - 1). Only re-append the
          // DOM stack when the position actually moved, to avoid pointless
          // reflow when the user re-grabs an already-topmost node.
          const newIdx = self._nodeZOrder.length;  // index after the upcoming push
          if (dIdx !== newIdx) zOrderChanged = true;
          self._nodeZOrder.push(n.id);
        }
        if (zOrderChanged) {
          self._zOrderDirty = true;
          // Sync the DOM stack right now so the dragged node visibly
          // surfaces to the top, even when positionChanged is false.
          const nodesContainer = self._getEl('canvasNodes');
          if (nodesContainer) {
            for (const id of self._nodeZOrder) {
              const zel = self._nodeElMap.get(id);
              if (zel) nodesContainer.appendChild(zel);
            }
          }
        }
      }
      // Select node on click (no actual drag movement)
      if (!self._dragActuallyMoved && self.dragState && self.dragState.nodes.length >= 1) {
        var clickId = self.dragState.nodes[0].id;
        self.selectedNodeIds.clear();
        self.selectedNodeIds.add(clickId);
        self._clearConnSelection();
        self.renderCanvas();
      }
      self.dragState = null;
      self.isDragging = false;
      self._nodeElMap.forEach(el => { el.style.transition = ''; });
      self.renderLines();
      if (positionChanged) self.saveCanvasSnapshot();  // only save snapshot when position actually changed, avoid no-op undo entries
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      window.removeEventListener('blur', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    window.addEventListener('blur', onUp);
  },

  // ── Socket Drag (data-driven, minimal design) ──
  //
  // Data model (socketDragState):
  //   { nodeId, dir, colorClass, node, toWorldX, toWorldY }
  //
  //   - Start point = fromNode's socket anchor (computed live from node.x/y)
  //   - End point   = toWorldX/Y (world coords, updated on mousemove)
  //   - Influence   = bezier control point (computed live in buildPath)
  //
  // Nothing else is stored. The line shape is regenerated every render.
  // Connection test on mouseup: is the end point within SOCKET_HIT_RADIUS
  // of any compatible socket? Pure geometry, no DOM hit-testing.

  startSocketDrag(e, nodeId, dir, colorClass) {
    e.preventDefault();
    const nodeEl = this._nodeElMap.get(nodeId);
    if (!nodeEl) return;
    const fromSocket = nodeEl.querySelector('.socket.' + dir);
    if (fromSocket) fromSocket.classList.add('dragging');

    const node = this.canvasState.nodes.find(n => n.id === nodeId);
    if (!node) return;

    const wp = this.getWorldPos(e.clientX, e.clientY);
    this.socketDragState = {
      nodeId, dir, colorClass, node,
      toWorldX: wp.x, toWorldY: wp.y
    };
    const self = this;

    function onMove(e2) {
      if (!self.socketDragState) return;
      const wp = self.getWorldPos(e2.clientX, e2.clientY);
      self.socketDragState.toWorldX = wp.x;
      self.socketDragState.toWorldY = wp.y;
      const svg = document.getElementById('linesSvg');
      if (svg) self._renderTempLine(svg);
    }

    function onUp() {
      if (self.socketDragState) {
        const sd = self.socketDragState;
        // Connection test: does the end point fall within
        // SOCKET_HIT_RADIUS of a compatible socket on another node?
        const hit = self._findSocketHit(sd.toWorldX, sd.toWorldY, sd.nodeId, sd.dir);
        if (hit) {
          let fromId, toId;
          if (sd.dir === 'out' && hit.dir === 'in') { fromId = sd.nodeId; toId = hit.nodeId; }
          else if (sd.dir === 'in' && hit.dir === 'out') { fromId = hit.nodeId; toId = sd.nodeId; }
          if (fromId && toId && !self.canvasState.connections.some(c => c.from === fromId && c.to === toId)) {
            self.canvasState.connections.push({ from: fromId, to: toId, label: '' });
            self.saveCanvasSnapshot();
          }
        }
        if (fromSocket) fromSocket.classList.remove('dragging');
        self.socketDragState = null;
        self.renderLines();
      }
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      window.removeEventListener('blur', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    window.addEventListener('blur', onUp);
    this.renderLines();
  },

  // Pure geometry hit test (no DOM dependency), correct at any zoom/pan
  // Hit radius = SOCKET_HIT_RADIUS (world coords, scale-invariant)
  _findSocketHit(wx, wy, excludeNodeId, requireDir) {
    const r = SOCKET_HIT_RADIUS;
    for (const n of this.canvasState.nodes) {
      if (n.id === excludeNodeId) continue;
      const inP = this._getSocketAnchor(n, 'in');
      const outP = this._getSocketAnchor(n, 'out');
      if (requireDir !== 'in') {
        const dx = wx - inP.x, dy = wy - inP.y;
        if (dx * dx + dy * dy <= r * r) return { nodeId: n.id, dir: 'in' };
      }
      if (requireDir !== 'out') {
        const dx = wx - outP.x, dy = wy - outP.y;
        if (dx * dx + dy * dy <= r * r) return { nodeId: n.id, dir: 'out' };
      }
    }
    return null;
  },

  // ── Node CRUD ──
  _addNodeAt(worldX, worldY) {
    if (this.readOnly) return;
    const id = 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    // _addNodeAt is called from two contexts:
    //   1. Double-click on canvas (worldX/worldY = click point in world
    //      coords). The y-offset of -40 lifts the node so the click lands
    //      in the header area, and the x offset centers the node on the
    //      click. This is the historical default behavior.
    //   2. addNode()'s "extend right" branch passes an already-computed
    //      final top-left position and signals asPosition=true to skip
    //      the centering math.
    const asPosition = arguments[2] === true;
    let x, y;
    if (asPosition) {
      x = Math.round(worldX / GRID) * GRID;
      y = Math.round(worldY / GRID) * GRID;
    } else {
      x = Math.round(worldX / GRID) * GRID - Math.round(NODE_W / 2 / GRID) * GRID;
      y = Math.round(worldY / GRID) * GRID - 40;
    }
    this.canvasState.nodes.push({
      id, label: '新节点', desc: '',
      color: this._selectedGenColor || 'blue', x, y,
      mirrored: false
    });
    this.selectedNodeIds.clear();
    this.selectedNodeIds.add(id);
    this._nodeZOrder.push(id);
    this.saveCanvasSnapshot();
    this.renderCanvas();
    if (this._autoOpenModal) this.openNodeModal(id);
    return id;
  },

  addNode() {
    if (this.readOnly) return;
    // Anchor-based layout (per user spec):
    //   1. First call: record the current viewport center as the anchor
    //      and place the node AT the center.
    //   2. Subsequent calls: compare the current viewport center to the
    //      saved anchor.
    //        - If the center MOVED (user panned) → re-anchor at the new
    //          center, reset the counter, and place at the new center.
    //        - If the center is UNCHANGED → keep the anchor, increment
    //          the counter, and place the node at anchor + counter*GRID
    //          along the x axis.
    // This avoids the "stack on the same point" problem when the user
    // rapidly clicks "+ 节点", while still respecting user panning.
    const c = this._getEl('canvasStage');
    if (!c || c.clientWidth === 0) {
      // Container not yet laid out — fall back to world origin.
      this._addNodeAt(WORLD_CENTER_X, WORLD_CENTER_Y, true);
      return;
    }
    const viewCx = (-this.panX + c.clientWidth / 2) / this.scale;
    const viewCy = (-this.panY + c.clientHeight / 2) / this.scale;
    // Tolerance: 1 grid unit. Anything less is floating-point noise (e.g.
    // the snap animation on a previously dragged node can sub-pixel-shift
    // panX/panY by a few hundredths).
    const centerChanged = this._lastAddCenterX === null ||
      Math.abs(viewCx - this._lastAddCenterX) > GRID ||
      Math.abs(viewCy - this._lastAddCenterY) > GRID;
    if (centerChanged) {
      this._lastAddCenterX = viewCx;
      this._lastAddCenterY = viewCy;
      this._addCounter = 0;
    } else {
      this._addCounter++;
    }
    // First node (counter=0) lands centered; subsequent nodes shift right
    // by N * GRID. This keeps every click producing a visible, non-
    // overlapping placement when the canvas is stationary.
    // _addNodeAt with asPosition=true treats the coords as the node's
    // TOP-LEFT, so we shift the center to the top-left by NODE_W/2.
    const worldX = viewCx - NODE_W / 2 + this._addCounter * GRID;
    const worldY = viewCy - NODE_H / 2;
    this._addNodeAt(worldX, worldY, true);
  },

  /* Click on canvas blank area → clear node selection */
  _onCanvasClick(e) {
    if (this._boxSelectJustCompleted) { this._boxSelectJustCompleted = false; return; }
    const target = e.target;
    if (target.closest('.node') || target.closest('.coord') || target.closest('.sel-overlay') || target.closest('.curve-handles')) return;
    if (this._curveEditState) { this._exitCurveEdit(); }
    if (this._dblClickTarget) { clearTimeout(this._dblClickTarget.timerId); this._dblClickTarget = null; }
    this.selectedNodeIds.clear();
    this._clearConnSelection();
    this.renderCanvas();
  },

  /* Double-click on canvas blank area → add node at that position */
  _onCanvasDblClick(e) {
    if (this.readOnly) return;
    const target = e.target;
    if (target.closest('.node') || target.closest('.coord') || target.closest('.sel-overlay')) return;
    const wp = this.getWorldPos(e.clientX, e.clientY);
    const newId = this._addNodeAt(wp.x, wp.y);
    if (newId && (e.ctrlKey || e.metaKey)) {
      setTimeout(() => this.openNodeModal(newId), 0);
    }
  },

  /* Copy selected nodes to internal clipboard */
  copyNodes() {
    if (this.selectedNodeIds.size === 0) return;
    this._clipboard = [];
    this.canvasState.nodes.forEach(n => {
      if (this.selectedNodeIds.has(n.id)) this._clipboard.push(structuredClone(n));
    });
    if (this._clipboard.length > 0) this.showToast('已复制 ' + this._clipboard.length + ' 个节点');
  },

  /* Paste nodes from clipboard, centered on the viewport */
  pasteNodes() {
    if (this.readOnly || this._clipboard.length === 0) return;
    // Compute the bounding box of the clipboard nodes in world coords.
    // We want the CENTER of this bbox to land at the viewport center, so
    // the user sees the pasted result directly (no scrolling, no overlap).
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const src of this._clipboard) {
      const x = src.x || 0, y = src.y || 0;
      if (x < minX) minX = x;
      if (x + NODE_W > maxX) maxX = x + NODE_W;
      if (y < minY) minY = y;
      if (y + NODE_H > maxY) maxY = y + NODE_H;
    }
    const bboxCx = (minX + maxX) / 2;
    const bboxCy = (minY + maxY) / 2;
    // Viewport center in world coords (or WORLD_CENTER origin if container
    // isn't laid out yet — same fallback as addNode).
    const c = this._getEl('canvasStage');
    let viewCx = WORLD_CENTER_X, viewCy = WORLD_CENTER_Y;
    if (c && c.clientWidth > 0) {
      viewCx = (-this.panX + c.clientWidth / 2) / this.scale;
      viewCy = (-this.panY + c.clientHeight / 2) / this.scale;
    }
    // Shift each clipboard node so the bbox center maps to the viewport center.
    // The node's "center" reference point (its top-left + half-size) is what
    // should land at viewCx/viewCy, so we use bboxCx/Cy as the offset
    // subtractors (not minX/minY) to keep the relative layout intact.
    const offsetX = viewCx - bboxCx;
    const offsetY = viewCy - bboxCy;
    const idMap = {};
    const newIds = [];
    this._clipboard.forEach(src => {
      const id = this._cloneNode(src, offsetX, offsetY);
      idMap[src.id] = id;
      newIds.push(id);
    });
    /* Copy connections between pasted nodes */
    this._clipboard.forEach(src => {
      this.canvasState.connections.forEach(c => {
        if (c.from === src.id && idMap[c.to]) {
          this.canvasState.connections.push({ from: idMap[src.id], to: idMap[c.to], label: c.label, cp1: c.cp1, cp2: c.cp2 });
        }
      });
    });
    this.selectedNodeIds.clear();
    newIds.forEach(id => this.selectedNodeIds.add(id));
    this.saveCanvasSnapshot();
    this.renderCanvas();
    this.showToast('已粘贴 ' + newIds.length + ' 个节点');
  },

  /* Select all nodes */
  selectAllNodes() {
    this.canvasState.nodes.forEach(n => this.selectedNodeIds.add(n.id));
    this.renderCanvas();
  },

  removeNode(id) {
    if (this.readOnly || !this.canvasState.nodes.some(n => n.id === id)) return;
    this.canvasState.nodes = this.canvasState.nodes.filter(n => n.id !== id);
    this.canvasState.connections = this.canvasState.connections.filter(c => c.from !== id && c.to !== id);
    this.selectedNodeIds.delete(id);
    if (this._curveEditState) {
      const parts = this._curveEditState.connKey.split('|');
      if (parts[0] === id || parts[1] === id) this._curveEditState = null;
    }
    const zi = this._nodeZOrder.indexOf(id);
    if (zi >= 0) this._nodeZOrder.splice(zi, 1);
    const el = this._nodeElMap.get(id);
    if (el) { el.remove(); this._nodeElMap.delete(id); }
    this.saveCanvasSnapshot();
    this.renderCanvas();
    this.showToast('节点已删除', 'warning');
  },

  removeNodes(ids) {
    if (this.readOnly) return;
    const idSet = new Set(ids);
    const before = this.canvasState.nodes.length;
    this.canvasState.nodes = this.canvasState.nodes.filter(n => !idSet.has(n.id));
    const removed = before - this.canvasState.nodes.length;
    if (removed === 0) return;
    this.canvasState.connections = this.canvasState.connections.filter(c => !idSet.has(c.from) && !idSet.has(c.to));
    // If the selected connection referenced a deleted node, drop the selection.
    if (this.selectedConnKey) {
      const parts = this.selectedConnKey.split('|');
      if (idSet.has(parts[0]) || idSet.has(parts[1])) this.selectedConnKey = null;
    }
    if (this._curveEditState) {
      const parts = this._curveEditState.connKey.split('|');
      if (idSet.has(parts[0]) || idSet.has(parts[1])) this._curveEditState = null;
    }
    this._nodeZOrder = this._nodeZOrder.filter(function(zid) { return !idSet.has(zid); });
    ids.forEach(id => {
      this.selectedNodeIds.delete(id);
      const el = this._nodeElMap.get(id);
      if (el) { el.remove(); this._nodeElMap.delete(id); }
    });
    this.saveCanvasSnapshot();
    this.renderCanvas();
    if (removed === 1) { this.showToast('节点已删除', 'warning'); }
    else { this.showToast('已删除 ' + removed + ' 个节点', 'warning'); }
  },

  openNodeModal(id) {
    if (this.readOnly) return;
    const n = this.canvasState.nodes.find(nn => nn.id === id);
    if (!n) return;
    this._modalNodeId = id;
    this.selectedNodeIds.clear();
    this.selectedNodeIds.add(id);
    document.getElementById('mTitle').textContent = '编辑节点';
    document.getElementById('mLabel').value = n.label;
    const mDesc = document.getElementById('mDesc');
    mDesc.value = n.desc || '';
    mDesc.style.cssText = 'resize:none;height:10em;overflow-y:auto';
    document.getElementById('modal').dataset.color = n.color;
    this._renderModalDots(n.color);
    document.getElementById('modal').classList.add('on');
    setTimeout(() => document.getElementById('mLabel').focus(), 30);
  },

  closeModal() {
    this.cancelCustomPicker();
    document.getElementById('modal').classList.remove('on');
    this._modalNodeId = null;
    this.closeAbout();
  },
  saveModal() {
    if (this.readOnly) { this.closeModal(); return; }
    const n = this.canvasState.nodes.find(nn => nn.id === this._modalNodeId);
    if (n) {
      n.label = document.getElementById('mLabel').value.trim() || n.label;
      n.desc = document.getElementById('mDesc').value.trim();
      const c = document.getElementById('modal').dataset.color;
      if (c) n.color = c;
    }
    this.closeModal();
    this.saveCanvasSnapshot();
    this.renderCanvas();
  },

  // ── Custom color picker ──
  openCustomPicker(initHex, onConfirm) {
    this._loadCustomColors();
    this._cpOnConfirm = onConfirm || null;
    this._cpState = null;
    const n = this.canvasState.nodes.find(nn => nn.id === this._modalNodeId);
    const hex = initHex || (n && /^#[0-9a-fA-F]{6}$/.test(n.color) ? n.color : '#4090ff');
    const rgb = this.hexToRgb(hex);
    const hsl = this.rgbToHsl(rgb.r, rgb.g, rgb.b);
    this._cpState = { h: hsl.h, s: hsl.s, l: hsl.l, r: rgb.r, g: rgb.g, b: rgb.b, hex: hex, dragging: false };
    document.getElementById('cpModal').classList.add('on');

    this._cpEls = {
      canvas: document.getElementById('mColorWheel'),
      dot: document.getElementById('mCpDot'),
      r: document.getElementById('mCpR'), g: document.getElementById('mCpG'), b: document.getElementById('mCpB'),
      preview: document.getElementById('mCpPreview'), hex: document.getElementById('mCpHex')
    };

    this._renderColorWheel();
    this._updateCpUI();

    const self = this;
    if (this._onWheelDown) this._cpEls.canvas.removeEventListener('mousedown', this._onWheelDown);
    this._wheelMove = null;
    this._wheelUp = null;
    this._onWheelDown = function(e) {
      e.preventDefault();
      self._cpFromWheel(e);
      self._wheelMove = function(ev) { ev.preventDefault(); self._cpFromWheel(ev); };
      self._wheelUp = function() { if (self._cpState) self._cpState.dragging = false; if (self._wheelMove) document.removeEventListener('mousemove', self._wheelMove); if (self._wheelUp) document.removeEventListener('mouseup', self._wheelUp); self._wheelMove = null; self._wheelUp = null; };
      document.addEventListener('mousemove', self._wheelMove);
      document.addEventListener('mouseup', self._wheelUp);
    };
    this._cpEls.canvas.addEventListener('mousedown', this._onWheelDown);

    [this._cpEls.r, this._cpEls.g, this._cpEls.b].forEach(inp => {
      inp.oninput = function() { self._cpFromRGB(); };
    });
  },
  cancelCustomPicker() {
    this._cpOnConfirm = null;
    document.getElementById('cpModal').classList.remove('on');
    if (this._wheelMove) document.removeEventListener('mousemove', this._wheelMove);
    if (this._wheelUp) document.removeEventListener('mouseup', this._wheelUp);
    this._wheelMove = null;
    this._wheelUp = null;
    if (this._onWheelDown && this._cpEls) this._cpEls.canvas.removeEventListener('mousedown', this._onWheelDown);
    this._onWheelDown = null;
    if (this._cpEls) {
      [this._cpEls.r, this._cpEls.g, this._cpEls.b].forEach(inp => { inp.oninput = null; });
    }
    this._cpEls = null;
    this._cpState = null;
  },
  confirmCustomColor() {
    if (!this._cpState) return;
    if (this.readOnly) { this.cancelCustomPicker(); return; }
    const hex = this._cpState.hex;
    const exists = this._customColors.indexOf(hex);
    if (exists >= 0) this._customColors.splice(exists, 1);
    this._customColors.push(hex);
    if (this._customColors.length > 4) this._customColors.shift();
    this._saveCustomColors();
    if (this._cpOnConfirm) this._cpOnConfirm(hex);
    this.cancelCustomPicker();
  },
  _renderModalDots(activeColor) {
    const cp = document.getElementById('mColors');
    if (!cp.children.length) { this._buildModalDots(activeColor); return; }
    cp.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.c === activeColor);
    });
  },
  _buildModalDots(activeColor) {
    const cp = document.getElementById('mColors');
    this._loadCustomColors();
    const mk = (c, bg, custom) => {
      return '<button class="m-dot' + (activeColor === c ? ' active' : '') + '" data-c="' + c + '" style="background:' + bg + '" title="' + c + '"></button>';
    };
    let html = COLORS.map(c => mk(c, COLOR_HEX[c], false)).join('');
    html += this._customColors.map(c => mk(c, c, true)).join('');
    html += '<button class="m-wheel-btn" data-c="__wheel__" title="\u81EA\u9009\u989C\u8272"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>';
    cp.innerHTML = html;
    cp.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        if (b.dataset.c === '__wheel__') { this.openCustomPicker(null, (hex) => { const n = this.canvasState.nodes.find(nn => nn.id === this._modalNodeId); if (n) { n.color = hex; this.saveCanvasSnapshot(); this.renderCanvas(); } document.getElementById('modal').dataset.color = hex; this._buildModalDots(hex); }); return; }
        document.getElementById('modal').dataset.color = b.dataset.c;
        this._renderModalDots(b.dataset.c);
      });
    });
  },

  // ── Color wheel rendering ──
  _renderColorWheel() {
    const canvas = (this._cpEls && this._cpEls.canvas) || document.getElementById('mColorWheel');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (this._wheelImageData) { ctx.putImageData(this._wheelImageData, 0, 0); if (this._cpState) this._updateWheelDot(); return; }
    const size = canvas.width, cx = size / 2, cy = size / 2, r = size / 2;
    for (let a = 0; a < 360; a++) {
      const ra = a * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, ra - .02, ra + .02); ctx.closePath();
      ctx.fillStyle = 'hsl(' + a + ',100%,50%)'; ctx.fill();
    }
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'white'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    this._wheelImageData = ctx.getImageData(0, 0, size, size);
    if (this._cpState) this._updateWheelDot();
  },
  _updateWheelDot() {
    const s = this._cpState;
    if (!this._cpEls) return;
    const canvas = this._cpEls.canvas;
    const cx = canvas.width / 2, cy = canvas.height / 2, r = canvas.width / 2;
    const a = s.h * Math.PI / 180, d = Math.min(r, (s.s / 100) * r);
    this._cpEls.dot.style.left = (cx + Math.cos(a) * d) + 'px';
    this._cpEls.dot.style.top = (cy + Math.sin(a) * d) + 'px';
  },
  _updateCpUI() {
    const s = this._cpState, e = this._cpEls;
    if (!e) return;
    e.r.value = s.r; e.g.value = s.g; e.b.value = s.b;
    e.preview.style.background = s.hex;
    e.hex.textContent = s.hex.toUpperCase();
  },
  _cpFromRGB() {
    if (!this._cpEls) return;
    const r = Math.max(0, Math.min(255, +this._cpEls.r.value || 0));
    const g = Math.max(0, Math.min(255, +this._cpEls.g.value || 0));
    const b = Math.max(0, Math.min(255, +this._cpEls.b.value || 0));
    const hsl = this.rgbToHsl(r, g, b);
    const hex = this.rgbToHex(r, g, b);
    this._cpState = { h: hsl.h, s: hsl.s, l: hsl.l, r, g, b, hex, dragging: false };
    this._updateCpUI(); this._updateWheelDot();
  },
  _cpFromWheel(e) {
    if (!this._cpState || !this._cpEls) return;
    const canvas = this._cpEls.canvas;
    const rect = canvas.getBoundingClientRect();
    const cx = canvas.width / 2, cy = canvas.height / 2, r = canvas.width / 2;
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX, my = (e.clientY - rect.top) * scaleY;
    const dx = mx - cx, dy = my - cy;
    const dist = Math.min(1, Math.sqrt(dx * dx + dy * dy) / r);
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    if (angle < 0) angle += 360;
    const rgb = this.hslToRgb(Math.round(angle), Math.round(dist * 100), 50);
    const hex = this.rgbToHex(rgb.r, rgb.g, rgb.b);
    this._cpState = { h: Math.round(angle), s: Math.round(dist * 100), l: 50, r: rgb.r, g: rgb.g, b: rgb.b, hex, dragging: true };
    this._updateCpUI(); this._updateWheelDot();
  },

  // ── Generation color picker (dropdown) ──
  _setGenColor(c) {
    this._selectedGenColor = c;
    const dots = document.getElementById('gColorDots');
    if (dots) {
      dots.querySelectorAll('.g-dot').forEach(b => {
        b.classList.toggle('active', b.dataset.c === c);
      });
    }
    const rc = this._resolveColor(c);
    const dot = document.getElementById('gColorDot');
    if (dot) dot.style.background = rc.hex;
    try { localStorage.setItem('flow_gen_color', c); } catch(e) { /* ignore */ }
  },
  _buildGDots() {
    const cp = document.getElementById('gColorDots');
    this._loadCustomColors();
    const active = this._selectedGenColor;
    const mk = (c, bg) => {
      return '<button class="g-dot' + (active === c ? ' active' : '') + '" data-c="' + c + '" style="background:' + bg + '" title="' + c + '"></button>';
    };
    let html = COLORS.map(c => mk(c, COLOR_HEX[c])).join('');
    html += this._customColors.map(c => mk(c, c)).join('');
    cp.innerHTML = html;
    const self = this;
    cp.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', function() {
        self._setGenColor(this.dataset.c);
      });
    });
  },
  _gOpenCustomPicker() {
    const initHex = this._selectedGenColor && /^#[0-9a-fA-F]{6}$/.test(this._selectedGenColor)
      ? this._selectedGenColor : '#4090ff';
    this.openCustomPicker(initHex, (hex) => {
      this._setGenColor(hex);
    });
  },

  // ── Context Menu ──
  showCtx(x, y, nodeId, connKey, editTarget) {
    this._ctxNodeId = nodeId;
    this._ctxConnKey = connKey || null;
    this._ctxEditTarget = editTarget || 'title';
    // Adaptive menu: nodes show edit/duplicate/mirror/properties/delete; connections show only
    // edit label/delete (duplicate, mirror, and properties are node-only operations).
    const isConn = !!connKey;
    const set = (id, show) => { const el = document.getElementById(id); if (el) el.style.display = show ? '' : 'none'; };
    set('ctxEdit', true);
    set('ctxDup', !isConn);
    set('ctxMirror', !isConn);
    set('ctxProps', !isConn);
    set('ctxDel', true);
    set('ctxSep1', !isConn);
    set('ctxSepMirror', !isConn);
    set('ctxSep2', !isConn);
    set('ctxCurve', isConn);
    set('ctxSepCurve', isConn);
    set('ctxResetCurve', isConn);
    document.getElementById('ctxEdit').textContent = isConn ? '编辑文字' : (editTarget === 'desc' ? '编辑描述' : '编辑');
    const m = document.getElementById('ctx');
    m.style.left = Math.max(0, Math.min(x, innerWidth - 110)) + 'px';
    m.style.top = Math.max(0, Math.min(y, innerHeight - 100)) + 'px';
    m.style.display = 'block';
  },

  ctxEdit() {
    if (this.readOnly) return;
    if (this._ctxNodeId) {
      if (this._ctxEditTarget === 'desc') {
        this._showDescEdit(this._ctxNodeId);
      } else {
        this.inlineEdit('nodeTitle', this._ctxNodeId);
      }
    }
    if (this._ctxConnKey) this.inlineEdit('edge', this._ctxConnKey);
    this._ctxNodeId = this._ctxConnKey = this._ctxEditTarget = null;
  },
  ctxProps() {
    if (this._ctxNodeId) this.openNodeModal(this._ctxNodeId);
    this._ctxNodeId = null;
  },
  ctxMirror() {
    if (this.readOnly || !this._ctxNodeId) return;
    const n = this.canvasState.nodes.find(nn => nn.id === this._ctxNodeId);
    if (n) { n.mirrored = !n.mirrored; this.saveCanvasSnapshot(); this.renderCanvas(); }
    this._ctxNodeId = null;
  },
  _cloneNode(src, offsetX, offsetY) {
    const id = 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    this.canvasState.nodes.push({
      id, label: src.label + ' 副本', desc: src.desc, color: src.color,
      x: (src.x || 0) + (offsetX || 30), y: (src.y || 0) + (offsetY || 30),
      mirrored: !!src.mirrored
    });
    this._nodeZOrder.push(id);
    return id;
  },

  ctxDup() {
    if (this.readOnly || !this._ctxNodeId) return;
    const src = this.canvasState.nodes.find(n => n.id === this._ctxNodeId);
    if (!src) return;
    const id = this._cloneNode(src);
    this.canvasState.connections.filter(c => c.from === this._ctxNodeId).forEach(c => {
      this.canvasState.connections.push({ from: id, to: c.to, label: c.label, cp1: c.cp1, cp2: c.cp2 });
    });
    this.canvasState.connections.filter(c => c.to === this._ctxNodeId).forEach(c => {
      this.canvasState.connections.push({ from: c.from, to: id, label: c.label, cp1: c.cp1, cp2: c.cp2 });
    });
    this._ctxNodeId = null;
    this.saveCanvasSnapshot();
    this.renderCanvas();
  },
  ctxCurveDrag() {
    if (this.readOnly || !this._ctxConnKey) return;
    if (this._curveEditState) { this._exitCurveEdit(); return; }
    const parts = this._ctxConnKey.split('|');
    const conn = this.canvasState.connections.find((c) => c.from === parts[0] && c.to === parts[1]);
    if (!conn) return;
    this.saveCanvasSnapshot();
    this._curveEditState = {
      connKey: this._ctxConnKey,
      origCp1: conn.cp1 ? { dx: conn.cp1.dx, dy: conn.cp1.dy } : null,
      origCp2: conn.cp2 ? { dx: conn.cp2.dx, dy: conn.cp2.dy } : null
    };
    this._renderCurveHandles();
    this._ctxConnKey = null;
  },
  ctxResetCurve() {
    if (this.readOnly || !this._ctxConnKey) return;
    const parts = this._ctxConnKey.split('|');
    const conn = this.canvasState.connections.find((c) => c.from === parts[0] && c.to === parts[1]);
    if (!conn) return;
    this.saveCanvasSnapshot();
    conn.cp1 = null;
    conn.cp2 = null;
    this._exitCurveEdit();
    this.renderLines();
    this._ctxNodeId = this._ctxConnKey = null;
  },
  _renderCurveHandles() {
    if (!this._curveEditState) return;
    const svg = this._getEl('curveOverlay');
    if (!svg) return;
    const existing = svg.querySelector('.curve-handles');
    if (existing) existing.remove();
    const parts = this._curveEditState.connKey.split('|');
    const conn = this.canvasState.connections.find((c) => c.from === parts[0] && c.to === parts[1]);
    const fromNode = this.canvasState.nodes.find((n) => n.id === parts[0]);
    const toNode = this.canvasState.nodes.find((n) => n.id === parts[1]);
    if (!conn || !fromNode || !toNode) return;
    const s = this.scale;
    const fromAnchor = this._getSocketAnchor(fromNode, 'out');
    const toAnchor = this._getSocketAnchor(toNode, 'in');
    const cp = this._getConnControlPoints(fromAnchor.x, fromAnchor.y, toAnchor.x, toAnchor.y, conn.cp1, conn.cp2, !!fromNode.mirrored, !!toNode.mirrored);
    const hGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    hGroup.setAttribute('class', 'curve-handles');
    const addGuideLine = (ax, ay, hxx, hyy) => {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', ax * s);
      line.setAttribute('y1', ay * s);
      line.setAttribute('x2', hxx * s);
      line.setAttribute('y2', hyy * s);
      line.setAttribute('stroke', '#3b82f6');
      line.setAttribute('stroke-width', String(1.5 * s));
      line.setAttribute('stroke-dasharray', '4 3');
      line.setAttribute('opacity', '0.6');
      line.setAttribute('pointer-events', 'none');
      return line;
    };
    hGroup.appendChild(addGuideLine(fromAnchor.x, fromAnchor.y, fromAnchor.x + cp.c1x, fromAnchor.y + cp.c1y));
    hGroup.appendChild(addGuideLine(toAnchor.x, toAnchor.y, toAnchor.x + cp.c2x, toAnchor.y + cp.c2y));
    const mkHandle = (idx, hx, hy) => {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', hx * s);
      circle.setAttribute('cy', hy * s);
      circle.setAttribute('r', 8);
      circle.setAttribute('fill', '#fff');
      circle.setAttribute('stroke', '#3b82f6');
      circle.setAttribute('stroke-width', String(2 * s));
      circle.setAttribute('style', 'cursor:move;pointer-events:all');
      circle.dataset.handleIdx = idx;
      circle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        this._curveEditState.handleIndex = idx;
        const onMove = (ev) => {
          if (!this._curveEditState || this._curveEditState.handleIndex !== idx) return;
          const wp = this.getWorldPos(ev.clientX, ev.clientY);
          const conn2 = this.canvasState.connections.find((cc) => cc.from === parts[0] && cc.to === parts[1]);
          if (!conn2) return;
          if (idx === '1') {
            const autoDx = Math.abs(toAnchor.x - fromAnchor.x) * 0.5;
            const autoC1x = fromNode.mirrored ? -autoDx : autoDx;
            conn2.cp1 = { dx: (wp.x - fromAnchor.x) - autoC1x, dy: (wp.y - fromAnchor.y) };
          } else {
            const autoDx = Math.abs(toAnchor.x - fromAnchor.x) * 0.5;
            const autoC2x = toNode.mirrored ? autoDx : -autoDx;
            conn2.cp2 = { dx: (wp.x - toAnchor.x) - autoC2x, dy: (wp.y - toAnchor.y) };
          }
          this._renderCurveHandles();
          this.renderLines();
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          if (this._curveEditState) this._curveEditState.handleIndex = null;
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
      return circle;
    };
    hGroup.appendChild(mkHandle('1', fromAnchor.x + cp.c1x, fromAnchor.y + cp.c1y));
    hGroup.appendChild(mkHandle('2', toAnchor.x + cp.c2x, toAnchor.y + cp.c2y));
    svg.appendChild(hGroup);
  },
  _exitCurveEdit(revert) {
    if (revert && this._curveEditState) {
      const parts = this._curveEditState.connKey.split('|');
      const conn = this.canvasState.connections.find((c) => c.from === parts[0] && c.to === parts[1]);
      if (conn) {
        conn.cp1 = this._curveEditState.origCp1;
        conn.cp2 = this._curveEditState.origCp2;
      }
      this.renderLines();
    }
    this._curveEditState = null;
    const svg = this._getEl('curveOverlay');
    if (svg) {
      const existing = svg.querySelector('.curve-handles');
      if (existing) existing.remove();
    }
    if (!revert) this.saveCanvasSnapshot();
  },
  ctxDel() {
    if (this.readOnly) return;
    if (this._ctxNodeId) this.removeNode(this._ctxNodeId);
    if (this._ctxConnKey) {
      const parts = this._ctxConnKey.split('|');
      const fromId = parts[0], toId = parts[1];
      this.canvasState.connections = this.canvasState.connections.filter(c => !(c.from === fromId && c.to === toId));
      // If the deleted connection was the selected one, drop the selection
      // so the highlight doesn't linger on a non-existent connection.
      if (this.selectedConnKey === this._ctxConnKey) this.selectedConnKey = null;
      if (this._curveEditState && this._curveEditState.connKey === this._ctxConnKey) this._curveEditState = null;
      this.saveCanvasSnapshot();
      this.renderLines();
      this.showToast('连线已删除', 'warning');
    }
    this._ctxNodeId = this._ctxConnKey = null;
  },

  // ── Inline Edit ──
  closeInlineEdit() {
    if (this._inlineEditTarget) {
      const t = this._inlineEditTarget.type;
      const id = this._inlineEditTarget.id;
      if (t === 'nodeTitle' || t === 'nodeDesc') {
        const sel = t === 'nodeTitle' ? '.node-header' : '.node-val';
        const nodeEl = this._nodeElMap.get(id);
        const target = nodeEl ? nodeEl.querySelector(sel) : null;
        if (target) {
          target.removeAttribute('contenteditable');
          target.style.cursor = '';
          target.style.outline = '';
          if (target._inlineKeydown) { target.removeEventListener('keydown', target._inlineKeydown); delete target._inlineKeydown; }
          if (target._inlineBlur) { target.removeEventListener('blur', target._inlineBlur); delete target._inlineBlur; }
          if (target._inlineWheel) { target.removeEventListener('wheel', target._inlineWheel); delete target._inlineWheel; }
          if (t === 'nodeDesc') {
            target.style.whiteSpace = '';
            target.style.setProperty('-webkit-line-clamp', '');
            target.scrollTop = 0;
            target.onmousedown = null;
          }
        }
        if (nodeEl) {
          if (nodeEl._hdr) nodeEl._hdr.onmousedown = null;
          if (nodeEl._body) nodeEl._body.onmousedown = null;
        }
      } else if (t === 'edge') {
        const lbl = this._labelByKey.get(id);
        if (lbl) lbl.style.visibility = '';
      }
    }
    this._inlineEditTarget = null;
    document.getElementById('inlineEdit').style.display = 'none';
  },

  _getInlineInput() {
    const t = this._inlineEditTarget;
    if (!t) return null;
    if (t.type === 'nodeTitle' || t.type === 'nodeDesc') {
      const sel = t.type === 'nodeTitle' ? '.node-header' : '.node-val';
      const el = this._nodeElMap.get(t.id);
      return el ? el.querySelector(sel) : null;
    }
    return document.getElementById('inlineInp');
  },

  saveInlineEdit() {
    if (!this._inlineEditTarget) return;
    const inp = this._getInlineInput();
    if (!inp) return;
    const val = (inp.value !== undefined ? inp.value.trim() : (inp.innerText || inp.textContent || '').trim());
    const { type, id } = this._inlineEditTarget;
    if (type === 'edge') {
      const parts = id.split('|');
      const fromId = parts[0], toId = parts[1];
      const conn = this.canvasState.connections.find(c => c.from === fromId && c.to === toId);
      if (conn) conn.label = val;
    } else if (type === 'nodeTitle') {
      const n = this.canvasState.nodes.find(nn => nn.id === id);
      if (n) n.label = val || n.label;
    } else if (type === 'nodeDesc') {
      const n = this.canvasState.nodes.find(nn => nn.id === id);
      if (n) n.desc = val;
    }
    this.closeInlineEdit();
    this.saveCanvasSnapshot();
    this.renderCanvas();
  },

  inlineEdit(type, id) {
    if (this.readOnly) return;
    if (this._inlineEditTarget) this.closeInlineEdit();
    const el = document.getElementById('inlineEdit');
    const inp = document.getElementById('inlineInp');
    const ta = document.getElementById('inlineTa');
    this._inlineEditTarget = { type, id };
    inp.style.display = 'none';
    ta.style.display = 'none';
    el.style.display = 'none';

    if (type === 'nodeTitle' || type === 'nodeDesc') {
      const isTitle = type === 'nodeTitle';
      const sel = isTitle ? '.node-header' : '.node-val';
      const nodeEl = this._nodeElMap.get(id);
      const target = nodeEl ? nodeEl.querySelector(sel) : null;
      if (!target) return;
      const n = this.canvasState.nodes.find(nn => nn.id === id);
      if (!n) return;
      if (isTitle) {
        target.onmousedown = function(e) { e.stopPropagation(); };
        const bodyEl = nodeEl.querySelector('.node-body');
        if (bodyEl) bodyEl.onmousedown = function(e) { e.stopPropagation(); };
      } else {
        target.onmousedown = function(e) { e.stopPropagation(); };
        const bodyEl = target.closest('.node-body');
        if (bodyEl) bodyEl.onmousedown = function(e) { e.stopPropagation(); };
        const headerEl = nodeEl.querySelector('.node-header');
        if (headerEl) headerEl.onmousedown = function(e) { e.stopPropagation(); };
      }
      target.contentEditable = 'plaintext-only';
      // Firefox fallback: 'plaintext-only' unsupported in FF <129
      if (target.isContentEditable === false) target.contentEditable = 'true';
      target.style.outline = 'none';
      target.style.cursor = 'text';
      if (!isTitle) {
        target.style.whiteSpace = 'pre-wrap';
        target.style.setProperty('-webkit-line-clamp', 'unset');
        const body = target.closest('.node-body');
        if (body) { body.classList.remove('has-overflow'); }
        if (!n.desc) { target.textContent = ''; }
      }
      setTimeout(() => {
        target.focus();
        const range = document.createRange();
        range.selectNodeContents(target);
        const selRange = window.getSelection();
        selRange.removeAllRanges();
        selRange.addRange(range);
      }, 0);
      const onKey = e => {
        e.stopPropagation();
        if (e.key === 'Escape') { e.preventDefault(); this.closeInlineEdit(); this.renderCanvas(); }
        if (e.key === 'Enter' && isTitle) { e.preventDefault(); this.saveInlineEdit(); }
      };
      const onBlur = () => { if (this._inlineEditTarget?.type === type) this.saveInlineEdit(); };
      const onWheel = e => { e.stopPropagation(); e.preventDefault(); target.scrollTop += e.deltaY; };
      target._inlineKeydown = onKey;
      target._inlineBlur = onBlur;
      target._inlineWheel = onWheel;
      target.addEventListener('keydown', onKey);
      target.addEventListener('blur', onBlur);
      if (!isTitle) { target.addEventListener('wheel', onWheel, { passive: false }); }
      return;
    }

    inp.style.display = '';
    const inputEl = inp;
    inputEl.style.cssText = 'background:#fff;color:inherit;border:2px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:11px;text-shadow:none';

    if (type === 'edge') {
      const parts = id.split('|');
      const fromId = parts[0], toId = parts[1];
      const conn = this.canvasState.connections.find(c => c.from === fromId && c.to === toId);
      if (!conn) return;
      const lbl = this._labelByKey.get(id);
      if (lbl) lbl.style.visibility = 'hidden';
      const a = this.canvasState.nodes.find(n => n.id === conn.from);
      const b = this.canvasState.nodes.find(n => n.id === conn.to);
      if (!a || !b) return;
      const fromP = this._getSocketAnchor(a, 'out'), toP = this._getSocketAnchor(b, 'in');
      const cp_ie = this._getConnControlPoints(fromP.x, fromP.y, toP.x, toP.y, conn.cp1, conn.cp2, !!a.mirrored, !!b.mirrored);
      const mx = (fromP.x + toP.x) / 2 + 0.375 * (cp_ie.c1x + cp_ie.c2x), my = (fromP.y + toP.y) / 2 + 0.375 * (cp_ie.c1y + cp_ie.c2y);
      const cRect = this._getEl('canvasStage').getBoundingClientRect();
      const sp = { x: mx * this.scale + this.panX + cRect.left, y: my * this.scale + this.panY + cRect.top };
      inputEl.value = conn.label || '';
      inp.style.width = '130px';
      el.style.left = (sp.x - 60) + 'px'; el.style.top = (sp.y - 14) + 'px';
    }
    el.style.display = 'block';
    setTimeout(() => { inputEl.focus(); inputEl.select(); }, 10);
  },

  // ── Export / Import ──
  doExport() {
    if (this.canvasState.nodes.length === 0) { this.showToast('无数据可导出', 'warning'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(this._serializeData(), null, 2)], { type: 'application/json' }));
    a.download = 'flow.json'; a.click(); this.showToast('已导出');
  },

  _roundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  },

  _roundedRectTop(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h);
