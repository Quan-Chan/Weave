name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # ── Job 1: 快速静态门禁(结构守护 + 纯函数单测) ──
  quick:
    name: 静态检查 (structure + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: 安装依赖 (test/)
        working-directory: test
        run: npm ci --cache ./.npm-cache

      - name: 结构守护 + 纯函数单测
        working-directory: test
        run: npm run test:fast

  # ── Job 2: GUI 全量回归(真实浏览器) ──
  gui:
    name: GUI 回归 (smoke/region/collapse/fold/undo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: 安装系统 Chrome(供 puppeteer-core 驱动)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-noto-cjk
        # fonts-noto-cjk: 中文界面渲染所需(截图/文本断言依赖字形)

      - name: 安装依赖 (test/)
        working-directory: test
        run: npm ci --cache ./.npm-cache

      - name: 运行 GUI 全量测试
        working-directory: test
        env:
          WEAVE_EDGE: /usr/bin/google-chrome
        run: npm test

      # 失败时归档截图,便于人工定位(GUI 测试各步截图到 test/shots*/)
      - name: 归档测试截图(即使失败)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shots
          path: |
            test/shots/**/*.png
            test/shots-region/**/*.png
            test/shots-collapse/**/*.png
            test/shots-dragsnap/**/*.png
          if-no-files-found: ignore
          retention-days: 7